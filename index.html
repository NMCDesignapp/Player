<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NMC Music">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="NMC Pro Music Player - Professional Audio Player with Visualizer">
    <meta name="application-name" content="NMC Music Pro">
    <meta name="msapplication-TileColor" content="#0a0a0f">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a0f' width='100' height='100' rx='20'/><text x='50' y='65' font-size='45' text-anchor='middle' fill='%23ff0055'>♪</text></svg>">
    <title>NMC Music Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
        body{background:#0a0a0f;background-image:radial-gradient(ellipse at 20% 50%,rgba(255,0,85,.03) 0%,transparent 50%),radial-gradient(ellipse at 80% 50%,rgba(0,212,255,.03) 0%,transparent 50%);font-family:'Inter','Segoe UI',sans-serif;height:100vh;height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden;color:#fff}
        .app-container{width:100%;max-width:1000px;height:100%;height:100dvh;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:10}
        .full-viz-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.65;transition:opacity .3s ease}
        .main-screen{background:linear-gradient(145deg,rgba(13,13,24,.6) 0%,rgba(0,0,5,.6) 100%);backdrop-filter:blur(2px);flex:1;border-radius:20px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 0 1px rgba(255,255,255,.1);min-height:0;z-index:2}
        .main-screen::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 0%,rgba(255,0,85,.08) 0%,transparent 60%);z-index:0;pointer-events:none;animation:ambientPulse 4s ease-in-out infinite alternate}
        @keyframes ambientPulse{0%{opacity:.5}100%{opacity:1}}
        .signature{position:absolute;top:12px;right:18px;font-family:'Orbitron',monospace;font-size:.7rem;color:#555;z-index:25;pointer-events:none;letter-spacing:2px}
        .signature span{font-weight:900;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.4)}
        .top-info{position:absolute;top:18px;left:0;width:100%;text-align:center;z-index:20;padding:0 25px}
        .song-title-display{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;text-shadow:0 0 20px rgba(255,0,85,.3);margin-bottom:4px;letter-spacing:1px;background:linear-gradient(90deg,#fff,#ff6b9d,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleShimmer 3s linear infinite;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        @keyframes titleShimmer{to{background-position:200% center}}
        .song-time-display{font-size:.8rem;color:#ff0055;font-family:'Orbitron',monospace;text-shadow:0 0 8px rgba(255,0,85,.4)}
        .visual-full{position:absolute;top:70px;left:0;width:100%;height:200px;display:flex;align-items:flex-end;justify-content:center;gap:3px;z-index:5;padding:0 8%;perspective:600px}
        .visual-bar{flex:1;max-width:12px;min-width:4px;border-radius:3px 3px 0 0;transition:height .08s ease-out;transform-origin:bottom}
        .visual-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:160px;height:160px;z-index:4;pointer-events:none;opacity:.5}
        .visual-ring canvas{width:100%;height:100%}
        .controls-area{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);width:92%;display:flex;flex-direction:column;gap:8px;z-index:30}
        .progress-wrapper{width:100%;background:rgba(20,20,35,.85);backdrop-filter:blur(20px);padding:10px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;box-shadow:0 8px 25px rgba(0,0,0,.3)}
        .progress-time{font-family:'Orbitron',monospace;font-size:.7rem;color:#888;width:48px;text-align:center}
        #seek-slider{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:5px;outline:none;-webkit-appearance:none;cursor:pointer}
        #seek-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:radial-gradient(circle,#fff 60%,#ff0055);border-radius:50%;box-shadow:0 0 15px rgba(255,0,85,.4);cursor:pointer;transition:transform .15s}
        #seek-slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
        .control-row{background:rgba(20,20,35,.85);backdrop-filter:blur(20px);border-radius:14px;padding:6px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);height:54px;gap:4px}
        .ctrl-btn{background:rgba(255,255,255,.03);color:#ff0055;border:1.5px solid rgba(255,0,85,.5);text-shadow:0 0 8px rgba(255,0,85,.4);box-shadow:0 0 12px rgba(255,0,85,.15),inset 0 0 8px rgba(255,0,85,.05);font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .2s cubic-bezier(.175,.885,.32,1.275);padding:0;border-radius:10px;display:flex;align-items:center;justify-content:center;letter-spacing:1px;flex:1;height:100%;position:relative;overflow:hidden}
        .ctrl-btn:active{background:#ff0055;color:#fff;text-shadow:0 0 15px #fff;box-shadow:0 0 40px rgba(255,0,85,.4);transform:scale(.95)}
        .ctrl-btn.active-loop{background:linear-gradient(135deg,#ff0055,#ff3377);color:#fff;text-shadow:0 0 8px rgba(255,255,255,.6);box-shadow:0 0 25px rgba(255,0,85,.4);animation:loopGlow 2s ease-in-out infinite}
        @keyframes loopGlow{0%,100%{box-shadow:0 0 20px rgba(255,0,85,.4)}50%{box-shadow:0 0 35px rgba(255,0,85,.6)}}
        .ctrl-btn.install-btn{border-color:rgba(0,230,118,.6);color:#00e676;text-shadow:0 0 8px rgba(0,230,118,.4);box-shadow:0 0 12px rgba(0,230,118,.15),inset 0 0 8px rgba(0,230,118,.05);animation:installPulse 3s ease-in-out infinite}
        @keyframes installPulse{0%,100%{box-shadow:0 0 8px rgba(0,230,118,.15)}50%{box-shadow:0 0 20px rgba(0,230,118,.35)}}
        .ctrl-btn.install-btn:active{background:#00e676;color:#0a0a0f}
        .bottom-area{height:32vh;display:flex;gap:10px;z-index:2}
        .playlist-container{background:rgba(18,18,26,.8);backdrop-filter:blur(12px);border-radius:16px;padding:12px;overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:80px;gap:10px;border:1px solid rgba(255,255,255,.08);align-content:start;box-shadow:0 10px 30px rgba(0,0,0,.3)}
        .playlist-container::-webkit-scrollbar{width:4px}
        .playlist-container::-webkit-scrollbar-track{background:transparent}
        .playlist-container::-webkit-scrollbar-thumb{background:rgba(255,0,85,.3);border-radius:2px}
        .song-btn{background:linear-gradient(145deg,#16162a,#0f0f1a);color:#aaa;border-radius:12px;position:relative;cursor:pointer;display:flex;justify-content:center;align-items:center;padding:8px;transition:all .2s ease;border:1px solid rgba(255,255,255,.04);box-shadow:4px 4px 10px rgba(0,0,0,.4),-2px -2px 8px rgba(255,255,255,.02)}
        .song-btn:active{transform:translateY(2px) scale(.97)}
        .song-btn.playing{color:#fff;background:linear-gradient(145deg,rgba(255,0,85,.2),rgba(255,0,85,.05));border:1.5px solid rgba(255,0,85,.6);box-shadow:0 0 20px rgba(255,0,85,.2);animation:playingPulse 2s infinite}
        @keyframes playingPulse{0%,100%{box-shadow:0 0 15px rgba(255,0,85,.15)}50%{box-shadow:0 0 25px rgba(255,0,85,.35)}}
        .song-name{font-size:.78rem;text-align:center;word-break:break-word;font-weight:600;line-height:1.3;width:100%}
        .song-settings-icon{position:absolute;top:4px;right:6px;font-size:.7rem;color:#888;background:rgba(0,0,0,.6);width:20px;height:20px;border-radius:12px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:.2s;z-index:10;opacity:.7;cursor:pointer}
        .song-settings-icon:hover{opacity:1;color:#ff0055;background:rgba(0,0,0,.8);transform:scale(1.1)}
        .volume-sidebar{background:rgba(18,18,26,.8);backdrop-filter:blur(12px);border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 0;border:1px solid rgba(255,255,255,.08);width:85px;min-width:85px;flex-shrink:0;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.3);gap:8px}
        .sys-vol-label{font-family:'Orbitron',monospace;font-size:.55rem;color:#555;text-transform:uppercase;letter-spacing:1px;text-align:center}
        .sys-vol-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:6px;font-size:.55rem;font-family:'Orbitron';font-weight:700;cursor:pointer}
        .sys-vol-badge.linked{background:rgba(0,230,118,.15);color:#00e676;border:1px solid rgba(0,230,118,.3)}
        .sys-vol-badge.unlinked{background:rgba(255,23,68,.1);color:#ff1744;border:1px solid rgba(255,23,68,.2)}
        .led-container{display:flex;flex-direction:column-reverse;gap:4px;height:70%;width:40px;justify-content:flex-start;align-items:center;pointer-events:none}
        .led-bar{width:100%;height:10px;background:#1a1a1a;border-radius:3px;transition:background-color .1s ease,box-shadow .1s;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
        .led-bar.active{box-shadow:0 0 6px currentColor}
        .vol-percent{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;color:#ff0055;text-shadow:0 0 10px rgba(255,0,85,.4);pointer-events:none;margin-top:2px}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(20,20,35,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);padding:12px 24px;border-radius:12px;font-size:.85rem;color:#fff;z-index:200;transition:transform .3s ease;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;font-family:'Inter',sans-serif}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(10px)}
        .modal-content{background:linear-gradient(145deg,#1a1a2e,#12121a);padding:30px;border-radius:16px;width:360px;max-width:90vw;border:1px solid rgba(255,255,255,.1);text-align:center}
        .modal-content h3{font-family:'Orbitron';margin-bottom:20px;color:#ff0055}
        .input-group{text-align:left;margin-bottom:15px}
        .input-group label{font-size:.8rem;color:#aaa;display:block;margin-bottom:5px}
        .input-group input{width:100%;padding:10px;background:rgba(0,0,0,.5);border:1px solid #333;color:#fff;border-radius:8px}
        .file-upload{border:2px dashed rgba(255,255,255,.2);padding:20px;border-radius:12px;cursor:pointer;margin-bottom:15px;font-size:.9rem;color:#aaa;transition:.2s}
        .file-upload:hover{border-color:#ff0055;color:#ff0055}
        .file-upload.drag-over{border-color:#00e676;color:#00e676;background:rgba(0,230,118,.05)}
        #file-input{display:none}
        .modal-actions{display:flex;gap:10px;margin-top:10px}
        .btn-modal{padding:10px;border:none;border-radius:8px;cursor:pointer;background:#ff0055;color:#fff;font-weight:bold;flex:1;font-size:.85rem}
        .btn-modal.cancel{background:#333}
        .btn-modal.danger{background:#aa2e4e}
        .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:300;backdrop-filter:blur(5px)}
        .loading-overlay.show{display:flex}
        .loading-spinner{width:50px;height:50px;border:4px solid rgba(255,0,85,.2);border-top-color:#ff0055;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* Install Modal */
        .install-modal-content{max-width:400px;text-align:left}
        .install-modal-content h3{text-align:center}
        .install-step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
        .install-step-num{background:#ff0055;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
        .install-step-text{font-size:.85rem;color:#ccc;line-height:1.5}
        .install-step-text b{color:#fff}
        .install-step-text .highlight{color:#00e676;font-weight:600}
    </style>
</head>
<body>
<canvas id="fullVizCanvas" class="full-viz-canvas"></canvas>
<div class="app-container">
    <div class="main-screen">
        <div class="signature">NMC<span> PRO</span></div>
        <div class="top-info">
            <div class="song-title-display" id="current-song-title">Chọn bài hát</div>
            <div class="song-time-display" id="current-time-display">0:00 / 0:00</div>
        </div>
        <div class="visual-full" id="visualizerBars"></div>
        <div class="visual-ring"><canvas id="ringCanvas" width="160" height="160"></canvas></div>
        <div class="controls-area">
            <div class="progress-wrapper">
                <span class="progress-time" id="current-time">0:00</span>
                <input type="range" id="seek-slider" value="0" step="0.01">
                <span class="progress-time" id="duration-time">0:00</span>
            </div>
            <div class="control-row">
                <div class="ctrl-btn" id="prev-btn"><i class="fas fa-backward-step"></i></div>
                <div class="ctrl-btn" id="play-pause-btn"><i class="fas fa-play"></i></div>
                <div class="ctrl-btn" id="next-btn"><i class="fas fa-forward-step"></i></div>
                <div class="ctrl-btn" id="loop-btn"><i class="fas fa-repeat"></i></div>
                <div class="ctrl-btn" id="upload-btn"><i class="fas fa-plus"></i></div>
                <div class="ctrl-btn install-btn" id="install-btn"><i class="fas fa-download"></i></div>
            </div>
        </div>
    </div>
    <div class="bottom-area">
        <div class="playlist-container" id="playlist-container"></div>
        <div class="volume-sidebar" id="volume-sidebar">
            <div class="sys-vol-label">VOLUME</div>
            <div class="led-container" id="led-container"></div>
            <div class="vol-percent" id="vol-percent">50%</div>
            <div class="sys-vol-badge linked" id="sys-vol-badge"><i class="fas fa-link"></i> LINK</div>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>
<div class="loading-overlay" id="loading-overlay"><div class="loading-spinner"></div></div>

<!-- Upload Modal -->
<div id="upload-modal" class="modal">
    <div class="modal-content">
        <h3>THÊM NHẠC</h3>
        <div class="file-upload" id="file-upload-area">
            <i class="fas fa-cloud-upload-alt"></i> Chọn hoặc kéo file vào đây
            <br><small style="color:#666;margin-top:6px;display:inline-block">MP3, WAV, FLAC, OGG, AAC, M4A, OPUS, AIFF...</small>
        </div>
        <div class="input-group">
            <label>Tên hiển thị (tùy chọn)</label>
            <input type="text" id="song-title-input" placeholder="Tên bài hát">
        </div>
        <div class="modal-actions">
            <button class="btn-modal cancel" id="close-modal">Hủy</button>
            <button class="btn-modal" id="confirm-upload">Thêm</button>
        </div>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.flac,.ogg,.aac,.m4a,.wma,.opus,.aiff,.ape,.alac,.mid,.midi" multiple>
    </div>
</div>

<!-- Settings Modal -->
<div id="song-settings-modal" class="modal">
    <div class="modal-content">
        <h3>CÀI ĐẶT BÀI HÁT</h3>
        <div class="input-group">
            <label><i class="fas fa-tag"></i> Tên bài</label>
            <input type="text" id="settings-song-name" readonly disabled style="background:#1e1e2e;">
        </div>
        <div class="input-group">
            <label><i class="fas fa-play-circle"></i> Bắt đầu (giây)</label>
            <input type="number" id="settings-start-time" step="0.1" min="0" value="0">
        </div>
        <div class="input-group">
            <label><i class="fas fa-stop-circle"></i> Kết thúc (giây) - <span style="color:#ff0055">0 = hết bài</span></label>
            <input type="number" id="settings-end-time" step="0.1" min="0" value="0">
        </div>
        <div class="modal-actions">
            <button class="btn-modal danger" id="delete-song-btn"><i class="fas fa-trash-alt"></i> Xoá</button>
            <button class="btn-modal cancel" id="close-settings-modal">Hủy</button>
            <button class="btn-modal" id="save-settings-btn">Lưu</button>
        </div>
    </div>
</div>

<!-- Install Guide Modal -->
<div id="install-guide-modal" class="modal">
    <div class="modal-content install-modal-content">
        <h3><i class="fas fa-mobile-alt" style="color:#00e676"></i> CÀI RA MÀN HÌNH</h3>
        <div id="install-steps"></div>
        <div class="modal-actions" style="margin-top:16px">
            <button class="btn-modal" id="install-action-btn" style="background:#00e676;color:#0a0a0f">Cài đặt ngay</button>
            <button class="btn-modal cancel" id="close-install-modal">Đóng</button>
        </div>
    </div>
</div>

<script>
// ===================== PWA MANIFEST (inline) =====================
(function createManifest() {
    const manifest = {
        name: "NMC Music Pro",
        short_name: "NMC Music",
        description: "Professional Music Player with Visualizer",
        start_url: window.location.href.split('?')[0],
        display: "standalone",
        orientation: "portrait",
        background_color: "#0a0a0f",
        theme_color: "#0a0a0f",
        categories: ["music", "entertainment"],
        icons: [
            { src: "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect fill='%230a0a0f' width='512' height='512' rx='100'/><text x='256' y='340' font-size='280' text-anchor='middle' fill='%23ff0055'>♪</text></svg>"), sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" },
            { src: "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230a0a0f' width='192' height='192' rx='40'/><text x='96' y='130' font-size='110' text-anchor='middle' fill='%23ff0055'>♪</text></svg>"), sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" }
        ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
})();

// ===================== IndexedDB =====================
const DB_NAME = 'NMCMusicDB';
const DB_VERSION = 1;
const STORE_NAME = 'songs';

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function saveSongToDB(d) { const db = await openDB(); return new Promise((res,rej) => { const tx = db.transaction(STORE_NAME,'readwrite'); tx.objectStore(STORE_NAME).put(d); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function deleteSongFromDB(id) { const db = await openDB(); return new Promise((res,rej) => { const tx = db.transaction(STORE_NAME,'readwrite'); tx.objectStore(STORE_NAME).delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function getAllSongsFromDB() { const db = await openDB(); return new Promise((res,rej) => { const tx = db.transaction(STORE_NAME,'readonly'); const r = tx.objectStore(STORE_NAME).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

// ===================== State =====================
let playlist = [];
let currentIndex = 0;
let isPlaying = false;
let loopMode = false;
let audio = new Audio();
audio.preload = 'auto';
let analyser = null, sourceNode = null, gainNode = null, audioContext = null;
let ringCtx = null, barsArray = [];
let systemVolumeLinked = true, currentVolume = 0.5;
let editingSongIndex = -1;
let fadeAnimationId = null, isFading = false, isSwitchingSong = false;
let deferredPrompt = null;

// ===================== Visualizer Setup =====================
const fullCanvas = document.getElementById('fullVizCanvas');
let fullCtx = fullCanvas.getContext('2d');
let particles = [];

function resizeFullCanvas() { fullCanvas.width = window.innerWidth; fullCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeFullCanvas);
resizeFullCanvas();

class Particle {
    constructor(x,y,vx,vy,sz,col) { this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.size=sz;this.color=col;this.alpha=.6; }
    update() { this.x+=this.vx;this.y+=this.vy;this.alpha-=.005; }
    draw(ctx) { ctx.globalAlpha=this.alpha;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill(); }
}

// ===================== DOM =====================
const playPauseBtn = document.getElementById('play-pause-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const loopBtn = document.getElementById('loop-btn');

// ===================== Audio Context + GainNode =====================
function setupAudioContext() {
    if (audioContext && audioContext.state !== 'closed') return;
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    gainNode = audioContext.createGain();
    gainNode.gain.value = currentVolume;
    sourceNode = audioContext.createMediaElementSource(audio);
    sourceNode.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(audioContext.destination);
    if (audioContext.state === 'suspended') audioContext.resume();
}

// ===================== Volume =====================
function updateVolumeUI() {
    volPercentSpan.innerText = Math.round(currentVolume * 100) + '%';
    const activeCount = Math.floor(currentVolume * 10);
    document.querySelectorAll('.led-bar').forEach((led, idx) => {
        if (idx < activeCount) {
            led.classList.add('active');
            led.style.backgroundColor = currentVolume <= .33 ? '#00e676' : currentVolume <= .66 ? '#ffea00' : '#ff1744';
        } else { led.classList.remove('active'); led.style.backgroundColor = '#1a1a1a'; }
    });
    sysVolBadge.className = systemVolumeLinked ? 'sys-vol-badge linked' : 'sys-vol-badge unlinked';
    sysVolBadge.innerHTML = systemVolumeLinked ? '<i class="fas fa-link"></i> LINK' : '<i class="fas fa-unlink"></i> MAN';
}

function buildLEDs() { ledContainer.innerHTML = ''; for (let i = 0; i < 10; i++) { const l = document.createElement('div'); l.classList.add('led-bar'); ledContainer.appendChild(l); } updateVolumeUI(); }
buildLEDs();

function setVolume(v) {
    v = Math.min(1, Math.max(0, v));
    currentVolume = v;
    if (gainNode && audioContext) gainNode.gain.setValueAtTime(v, audioContext.currentTime);
    if (audio) audio.volume = v;
    updateVolumeUI();
}

    systemVolumeLinked = !systemVolumeLinked;
    showToast(systemVolumeLinked ? 'Đã liên kết âm lượng' : 'Âm lượng thủ công');
    updateVolumeUI();
});

// ===================== Fade In/Out (GainNode + rAF) =====================
function cancelFade() { if (fadeAnimationId) { cancelAnimationFrame(fadeAnimationId); fadeAnimationId = null; } isFading = false; }

function fadeAudio(from, to, duration, callback) {
    cancelFade(); isFading = true;
    const start = performance.now();
    function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2; // easeInOutQuad
        const val = from + (to - from) * e;
        if (gainNode && audioContext) gainNode.gain.setValueAtTime(val, audioContext.currentTime);
        audio.volume = val;
        if (p < 1) fadeAnimationId = requestAnimationFrame(tick);
        else { isFading = false; fadeAnimationId = null; if (callback) callback(); }
    }
    fadeAnimationId = requestAnimationFrame(tick);
}

// ===================== Load Song with Fade =====================
async function loadSongAudio(song) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(song.id);
        req.onsuccess = () => { if (req.result?.blob) { audio.src = URL.createObjectURL(req.result.blob); audio.load(); resolve(); } else reject('No data'); };
        req.onerror = () => reject(req.error);
    });
}

function loadSongWithFade(index, autoPlay = true) {
    if (!playlist[index] || isSwitchingSong) return;
    isSwitchingSong = true;
    const wasPlaying = isPlaying;
    const doLoad = () => {
        audio.pause(); isPlaying = false;
        const song = playlist[index];
        currentIndex = index;
        loadSongAudio(song).then(() => {
            songTitleDisplay.innerText = song.name;
            if (gainNode) gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            audio.volume = 0;
            if (autoPlay) {
                audio.play().then(() => {
                    isPlaying = true; updatePlayPauseUI(); updatePlaylistUI();
                    fadeAudio(0, currentVolume, 400, () => { isSwitchingSong = false; });
                    setupMediaSession(song);
                }).catch(e => { console.log(e); isSwitchingSong = false; });
            } else { isSwitchingSong = false; }
            if (audioContext?.state === 'suspended') audioContext.resume();
            audio.addEventListener('canplaythrough', function h() {
                audio.removeEventListener('canplaythrough', h);
                if (audio.duration && isFinite(audio.duration)) {
                    durationSpan.innerText = formatTime(audio.duration);
                    const s = song.startTime || 0;
                    if (s > 0 && audio.currentTime < s) audio.currentTime = s;
                }
            });
            updatePlaylistUI();
        }).catch(e => { console.error(e); isSwitchingSong = false; showToast('Lỗi tải bài hát'); });
    };
    if (audio.src && audio.readyState > 0 && (isPlaying || isFading)) {
        fadeAudio(gainNode ? gainNode.gain.value : audio.volume, 0, 250, doLoad);
    } else doLoad();
}

// ===================== Playback =====================
function playAudio() {
    if (!playlist.length) { showToast('Hãy thêm nhạc trước'); return; }
    if (!audio.src || audio.src === location.href) { loadSongWithFade(currentIndex, true); return; }
    const song = playlist[currentIndex];
    const s = song.startTime || 0;
    if (audio.readyState >= 2 && audio.currentTime < s) audio.currentTime = s;
    fadeAudio(gainNode ? gainNode.gain.value : 0, currentVolume, 200);
    audio.play().then(() => { isPlaying = true; updatePlayPauseUI(); updatePlaylistUI(); setupMediaSession(song); }).catch(e => console.log(e));
    if (audioContext?.state === 'suspended') audioContext.resume();
}

function pauseAudio() {
    const cur = gainNode ? gainNode.gain.value : audio.volume;
    fadeAudio(cur, 0, 150, () => { audio.pause(); isPlaying = false; updatePlayPauseUI(); updatePlaylistUI(); });
}

function updatePlayPauseUI() {
    const i = playPauseBtn.querySelector('i');
    i.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
}

function nextSong() {
    if (!playlist.length) return;
    if (loopMode) { const s = playlist[currentIndex].startTime || 0; audio.currentTime = s; if (!isPlaying) playAudio(); return; }
    let n = currentIndex + 1; if (n >= playlist.length) n = 0;
    loadSongWithFade(n, true);
}

function prevSong() {
    if (!playlist.length) return;
    if (audio.currentTime > 3) { const s = playlist[currentIndex].startTime || 0; audio.currentTime = s; return; }
    let n = currentIndex - 1; if (n < 0) n = playlist.length - 1;
    loadSongWithFade(n, true);
}

function enforceSongBounds() {
    if (!playlist[currentIndex]) return;
    const s = playlist[currentIndex].startTime || 0, e = playlist[currentIndex].endTime || 0;
    if (e > 0 && audio.currentTime >= e) { if (loopMode) { audio.currentTime = s; audio.play(); } else nextSong(); return; }
    if (audio.currentTime < s) audio.currentTime = s;
}

// ===================== Media Session =====================
function setupMediaSession(song) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: song.name, artist: 'NMC Pro Player', album: 'My Music' });
    navigator.mediaSession.setActionHandler('play', () => playAudio());
    navigator.mediaSession.setActionHandler('pause', () => pauseAudio());
    navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
}

// ===================== Playlist UI =====================
function updatePlaylistUI() {
    playlistContainer.innerHTML = '';
    playlist.forEach((song, idx) => {
        const btn = document.createElement('div');
        btn.classList.add('song-btn');
        if (idx === currentIndex && isPlaying) btn.classList.add('playing');
        btn.innerHTML = `<div class="song-name">${escapeHtml(song.name)}</div>`;
        const ico = document.createElement('div');
        ico.className = 'song-settings-icon';
        ico.innerHTML = '<i class="fas fa-cog"></i>';
        ico.addEventListener('click', e => { e.stopPropagation(); openSongSettings(idx); });
        btn.appendChild(ico);
        btn.addEventListener('click', () => { if (currentIndex === idx && isPlaying) pauseAudio(); else loadSongWithFade(idx, true); });
        playlistContainer.appendChild(btn);
    });
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]||c); }

});

// ===================== Song Settings =====================
const settingsModal = document.getElementById('song-settings-modal');

function openSongSettings(idx) {
    editingSongIndex = idx; const s = playlist[idx];
    document.getElementById('settings-song-name').value = s.name;
    document.getElementById('settings-start-time').value = s.startTime || 0;
    document.getElementById('settings-end-time').value = s.endTime || 0;
    settingsModal.style.display = 'flex';
}

async function saveSongSettings() {
    if (editingSongIndex === -1) return;
    const s = playlist[editingSongIndex];
    let st = parseFloat(document.getElementById('settings-start-time').value) || 0;
    let en = parseFloat(document.getElementById('settings-end-time').value) || 0;
    if (en > 0 && en <= st) { showToast('Kết thúc phải lớn hơn bắt đầu'); en = 0; }
    s.startTime = st; s.endTime = en;
    try { const db = await openDB(); const tx = db.transaction(STORE_NAME,'readwrite'); const store = tx.objectStore(STORE_NAME); const r = store.get(s.id); r.onsuccess = () => { if (r.result) { r.result.startTime = st; r.result.endTime = en; store.put(r.result); } }; } catch(e){}
    if (editingSongIndex === currentIndex && audio.src) { if (audio.currentTime < st) audio.currentTime = st; if (en > 0 && audio.currentTime >= en) { loopMode ? audio.currentTime = st : nextSong(); } }
    showToast(`Đã lưu: "${s.name}"`); settingsModal.style.display = 'none'; editingSongIndex = -1;
}

async function deleteCurrentSong() {
    if (editingSongIndex === -1) return;
    const rm = playlist.splice(editingSongIndex, 1)[0];
    try { await deleteSongFromDB(rm.id); } catch(e){}
    showToast(`Đã xoá "${rm.name}"`);
    if (!playlist.length) { audio.pause(); audio.src = ''; isPlaying = false; currentIndex = 0; songTitleDisplay.innerText = 'Chọn bài hát'; updatePlayPauseUI(); }
    else { if (editingSongIndex < currentIndex) currentIndex--; else if (editingSongIndex === currentIndex) { if (currentIndex >= playlist.length) currentIndex = playlist.length - 1; if (currentIndex >= 0) loadSongWithFade(currentIndex, true); } }
    settingsModal.style.display = 'none'; editingSongIndex = -1; updatePlaylistUI();
}

document.getElementById('close-settings-modal').addEventListener('click', () => { settingsModal.style.display = 'none'; editingSongIndex = -1; });
document.getElementById('save-settings-btn').addEventListener('click', saveSongSettings);
document.getElementById('delete-song-btn').addEventListener('click', deleteCurrentSong);

    if (/iPad|iPhone|iPod/.test(ua)) return 'ios';
    if (/Android/.test(ua)) return 'android';
    if (/Chrome/.test(ua) && !/Edge|OPR/.test(ua)) return 'chrome';
    if (/Edge/.test(ua)) return 'edge';
    if (/Firefox/.test(ua)) return 'firefox';
    if (/SamsungBrowser/.test(ua)) return 'samsung';
    return 'other';
}

if ('serviceWorker' in navigator) {
    const swCode = `
        const C='nmc-v2';
        self.addEventListener('install',e=>{self.skipWaiting()});
        self.addEventListener('activate',e=>{self.clients.claim()});
        self.addEventListener('fetch',e=>{

// ===================== Visualizers =====================
let freqData = new Uint8Array(64);

function drawFullVisualizer() {
    if (!analyser) { requestAnimationFrame(drawFullVisualizer); return; }
    analyser.getByteFrequencyData(freqData);
    fullCtx.clearRect(0,0,fullCanvas.width,fullCanvas.height);
    let g = fullCtx.createLinearGradient(0,0,fullCanvas.width,fullCanvas.height);
    g.addColorStop(0,'rgba(10,10,20,0.2)'); g.addColorStop(1,'rgba(0,0,0,0.4)');
    fullCtx.fillStyle = g; fullCtx.fillRect(0,0,fullCanvas.width,fullCanvas.height);
    const cx = fullCanvas.width/2, cy = fullCanvas.height/2;
    const mr = Math.min(fullCanvas.width,fullCanvas.height)*0.4;
    for (let i=0;i<64;i++) {
        let v = freqData[i]/255, h = 10+v*80, a = (i/64)*Math.PI*2, r = mr+h*0.6;
        fullCtx.beginPath();
        fullCtx.moveTo(cx+Math.cos(a)*(mr-8),cy+Math.sin(a)*(mr-8));
        fullCtx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
        fullCtx.lineWidth=4; fullCtx.strokeStyle=`hsl(${320+v*80},100%,60%)`;
        fullCtx.shadowBlur=12; fullCtx.shadowColor='#ff0055'; fullCtx.stroke();
    }
    fullCtx.shadowBlur=0;
    if (freqData.reduce((a,b)=>a+b,0)>200) {
        for (let i=0;i<3;i++) {
            let a=Math.random()*Math.PI*2, sp=1+Math.random()*3, sz=2+Math.random()*4;
            particles.push(new Particle(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp,sz,`hsl(${Math.random()*60+300},80%,60%)`));
        }
    }
    for (let i=particles.length-1;i>=0;i--) { particles[i].update(); particles[i].draw(fullCtx); if (particles[i].alpha<=0) particles.splice(i,1); }
    requestAnimationFrame(drawFullVisualizer);
}
drawFullVisualizer();

function updateBarsVisualizer() {
    if (!analyser) { requestAnimationFrame(updateBarsVisualizer); return; }
    const d = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(d);
    const step = Math.floor(d.length/barsArray.length);
    for (let i=0;i<barsArray.length;i++) {
        let v=d[i*step]||0, h=(v/255)*80+4;
        barsArray[i].style.height=h+'px';
        barsArray[i].style.backgroundColor=`hsl(${320+(v/255)*40},100%,60%)`;
    }
    if (ringCtx) {
        ringCtx.clearRect(0,0,160,160);
        let avg=0; for(let i=0;i<d.length;i++) avg+=d[i]; avg/=d.length;
        ringCtx.beginPath(); ringCtx.arc(80,80,40+(avg/255)*50,0,Math.PI*2);
        ringCtx.strokeStyle=`rgba(255,0,85,${0.3+avg/500})`; ringCtx.lineWidth=3; ringCtx.stroke();
        for(let i=0;i<12;i++){
            let a=(Date.now()/300+i)%(Math.PI*2),r=70+(avg/255)*20;
            ringCtx.fillStyle='#ff0055'; ringCtx.beginPath();
            ringCtx.arc(80+Math.cos(a)*r,80+Math.sin(a)*r,3+avg/80,0,Math.PI*2); ringCtx.fill();
        }
    }
    requestAnimationFrame(updateBarsVisualizer);
}
updateBarsVisualizer();

// ===================== Utility =====================
function formatTime(s) { if(isNaN(s)||!isFinite(s)) return '0:00'; let m=Math.floor(s/60),sec=Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }
function showToast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500); }
function showLoading(s) { document.getElementById('loading-overlay').classList.toggle('show',s); }

// ===================== Init =====================
async function initApp() {
    const sv = localStorage.getItem('nmc_vol');
    if (sv !== null) { currentVolume = parseFloat(sv); if (isNaN(currentVolume)) currentVolume = 0.5; }
    const sl = localStorage.getItem('nmc_loop');
    if (sl === 'true') { loopMode = true; loopBtn.classList.add('active-loop'); }

    const initCtx = () => { setupAudioContext(); document.removeEventListener('click',initCtx); document.removeEventListener('touchstart',initCtx); };
    document.addEventListener('click', initCtx);
    document.addEventListener('touchstart', initCtx);

    try {
        const saved = await getAllSongsFromDB();
        if (saved.length) {
            playlist = saved.map(s => ({ id:s.id, name:s.name, startTime:s.startTime||0, endTime:s.endTime||0, fileSize:s.fileSize||0, fileType:s.fileType||'' }));
            showToast(`Đã tải ${playlist.length} bài hát`);
        }
    } catch(e) { console.error(e); }

    setVolume(currentVolume);
    updatePlaylistUI();

    const si = localStorage.getItem('nmc_idx');
    if (si !== null) { const idx = parseInt(si); if (idx >= 0 && idx < playlist.length) { currentIndex = idx; songTitleDisplay.innerText = playlist[currentIndex].name; } }

    setInterval(() => { localStorage.setItem('nmc_vol', currentVolume); localStorage.setItem('nmc_loop', loopMode); localStorage.setItem('nmc_idx', currentIndex); }, 2000);
}
initApp();

// ===================== Keyboard =====================
document.addEventListener('keydown', e => {
    switch(e.code) {
        case 'Space': e.preventDefault(); isPlaying ? pauseAudio() : playAudio(); break;
        case 'ArrowLeft': e.preventDefault(); prevSong(); break;
        case 'ArrowRight': e.preventDefault(); nextSong(); break;
        case 'ArrowUp': e.preventDefault(); setVolume(currentVolume + .05); break;
        case 'ArrowDown': e.preventDefault(); setVolume(currentVolume - .05); break;
        case 'KeyL': loopMode=!loopMode; loopBtn.classList.toggle('active-loop',loopMode); showToast(loopMode?'Lặp lại':'Tắt lặp'); break;
    }
});
</script>
