<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NMC Music">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="NMC Pro Music Player - Professional Audio Player with Visualizer">
    <title>Pro Music Player - NMC Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #0a0a0f;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(255, 0, 85, 0.03) 0%, transparent 50%),
                              radial-gradient(ellipse at 80% 50%, rgba(0, 212, 255, 0.03) 0%, transparent 50%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            height: 100dvh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 10;
        }

        .full-viz-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.65;
            transition: opacity 0.3s ease;
        }

        .main-screen {
            background: linear-gradient(145deg, rgba(13,13,24,0.6) 0%, rgba(0,0,5,0.6) 100%);
            backdrop-filter: blur(2px);
            flex: 1;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 1px rgba(255, 255, 255, 0.1);
            min-height: 0;
            z-index: 2;
        }

        .main-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.08) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
            animation: ambientPulse 4s ease-in-out infinite alternate;
        }

        @keyframes ambientPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .signature {
            position: absolute;
            top: 12px;
            right: 18px;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            color: #555;
            z-index: 25;
            pointer-events: none;
            letter-spacing: 2px;
        }
        .signature span {
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .top-info {
            position: absolute;
            top: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            padding: 0 25px;
        }

        .song-title-display {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
            margin-bottom: 4px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #ff6b9d, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleShimmer 3s linear infinite;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes titleShimmer {
            to { background-position: 200% center; }
        }

        .song-time-display {
            font-size: 0.8rem;
            color: #ff0055;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
        }

        .visual-full {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            height: 200px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            z-index: 5;
            padding: 0 8%;
            perspective: 600px;
        }

        .visual-bar {
            flex: 1;
            max-width: 12px;
            min-width: 4px;
            border-radius: 3px 3px 0 0;
            transition: height 0.08s ease-out;
            transform-origin: bottom;
        }

        .visual-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            z-index: 4;
            pointer-events: none;
            opacity: 0.5;
        }
        .visual-ring canvas {
            width: 100%;
            height: 100%;
        }

        .controls-area {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
        }

        .progress-wrapper {
            width: 100%;
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(20px);
            padding: 10px 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .progress-time {
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            color: #888;
            width: 48px;
            text-align: center;
        }

        #seek-slider {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        #seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle, #fff 60%, #ff0055);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            cursor: pointer;
            transition: transform 0.15s;
        }
        #seek-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .control-row {
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 14px;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            height: 58px;
            gap: 6px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.03);
            color: #ff0055;
            border: 1.5px solid rgba(255, 0, 85, 0.5);
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.15), inset 0 0 8px rgba(255, 0, 85, 0.05);
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .ctrl-btn:active {
            background: #ff0055;
            color: white;
            text-shadow: 0 0 15px white;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.4);
            transform: scale(0.95);
        }
        .ctrl-btn.active-loop {
            background: linear-gradient(135deg, #ff0055, #ff3377);
            color: white;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
            animation: loopGlow 2s ease-in-out infinite;
        }
        @keyframes loopGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }
            50% { box-shadow: 0 0 35px rgba(255, 0, 85, 0.6); }
        }
        .ctrl-btn.install-btn {
            border-color: rgba(0, 230, 118, 0.5);
            color: #00e676;
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.15), inset 0 0 8px rgba(0, 230, 118, 0.05);
        }
        .ctrl-btn.install-btn:active {
            background: #00e676;
            color: #0a0a0f;
        }

        .bottom-area {
            height: 32vh;
            display: flex;
            gap: 10px;
            z-index: 2;
        }

        .playlist-container {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px;
            overflow-y: auto;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 80px;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            align-content: start;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .playlist-container::-webkit-scrollbar { width: 4px; }
        .playlist-container::-webkit-scrollbar-track { background: transparent; }
        .playlist-container::-webkit-scrollbar-thumb { background: rgba(255, 0, 85, 0.3); border-radius: 2px; }

        .song-btn {
            background: linear-gradient(145deg, #16162a, #0f0f1a);
            color: #aaa;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4), -2px -2px 8px rgba(255, 255, 255, 0.02);
        }
        .song-btn:active {
            transform: translateY(2px) scale(0.97);
        }
        .song-btn.playing {
            color: white;
            background: linear-gradient(145deg, rgba(255, 0, 85, 0.2), rgba(255, 0, 85, 0.05));
            border: 1.5px solid rgba(255, 0, 85, 0.6);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
            animation: playingPulse 2s infinite;
        }
        @keyframes playingPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 85, 0.15); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 85, 0.35); }
        }

        .song-name {
            font-size: 0.78rem;
            text-align: center;
            word-break: break-word;
            font-weight: 600;
            line-height: 1.3;
            width: 100%;
        }

        .song-settings-icon {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.7rem;
            color: #888;
            background: rgba(0,0,0,0.6);
            width: 20px;
            height: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            z-index: 10;
            opacity: 0.7;
            cursor: pointer;
        }
        .song-settings-icon:hover {
            opacity: 1;
            color: #ff0055;
            background: rgba(0,0,0,0.8);
            transform: scale(1.1);
        }

        .volume-sidebar {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 85px;
            min-width: 85px;
            flex-shrink: 0;
            touch-action: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            gap: 8px;
        }

        .sys-vol-label {
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .sys-vol-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.55rem;
            font-family: 'Orbitron';
            font-weight: 700;
            cursor: pointer;
        }
        .sys-vol-badge.linked {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        .sys-vol-badge.unlinked {
            background: rgba(255, 23, 68, 0.1);
            color: #ff1744;
            border: 1px solid rgba(255, 23, 68, 0.2);
        }

        .led-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
            height: 70%;
            width: 40px;
            justify-content: flex-start;
            align-items: center;
            pointer-events: none;
        }

        .led-bar {
            width: 100%;
            height: 10px;
            background: #1a1a1a;
            border-radius: 3px;
            transition: background-color 0.1s ease, box-shadow 0.1s;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
        }
        .led-bar.active {
            box-shadow: 0 0 6px currentColor;
        }

        .vol-percent {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
            pointer-events: none;
            margin-top: 2px;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #fff;
            z-index: 200;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            font-family: 'Inter', sans-serif;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1a2e, #12121a);
            padding: 30px;
            border-radius: 16px;
            width: 360px;
            max-width: 90vw;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .modal-content h3 {
            font-family: 'Orbitron';
            margin-bottom: 20px;
            color: #ff0055;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .input-group label {
            font-size: 0.8rem;
            color: #aaa;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
        }

        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #aaa;
            transition: 0.2s;
        }
        .file-upload:hover {
            border-color: #ff0055;
            color: #ff0055;
        }
        .file-upload.drag-over {
            border-color: #00e676;
            color: #00e676;
            background: rgba(0, 230, 118, 0.05);
        }

        #file-input { display: none; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-modal {
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ff0055;
            color: white;
            font-weight: bold;
            flex: 1;
            font-size: 0.85rem;
        }
        .btn-modal.cancel { background: #333; }
        .btn-modal.danger { background: #aa2e4e; }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
            backdrop-filter: blur(5px);
        }
        .loading-overlay.show { display: flex; }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,0,85,0.2);
            border-top-color: #ff0055;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Install banner */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.15), rgba(0, 180, 100, 0.1));
            border: 1px solid rgba(0, 230, 118, 0.3);
            backdrop-filter: blur(20px);
            padding: 14px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 150;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 230, 118, 0.15);
            max-width: 90vw;
        }
        .install-banner.show {
            transform: translateX(-50%) translateY(0);
        }
        .install-banner-text {
            font-size: 0.85rem;
            color: #00e676;
            font-weight: 600;
        }
        .install-banner-btn {
            background: #00e676;
            color: #0a0a0f;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .install-banner-close {
            color: #888;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 4px;
        }
    </style>
</head>
<body>

<canvas id="fullVizCanvas" class="full-viz-canvas"></canvas>

<div class="app-container">
    <div class="main-screen">
        <div class="signature">NMC<span> PRO</span></div>
        <div class="top-info">
            <div class="song-title-display" id="current-song-title">Chọn bài hát</div>
            <div class="song-time-display" id="current-time-display">0:00 / 0:00</div>
        </div>

        <div class="visual-full" id="visualizerBars"></div>
        <div class="visual-ring">
            <canvas id="ringCanvas" width="160" height="160"></canvas>
        </div>

        <div class="controls-area">
            <div class="progress-wrapper">
                <span class="progress-time" id="current-time">0:00</span>
                <input type="range" id="seek-slider" value="0" step="0.01">
                <span class="progress-time" id="duration-time">0:00</span>
            </div>
            <div class="control-row">
                <div class="ctrl-btn" id="prev-btn"><i class="fas fa-backward-step"></i> <span style="margin-left:4px">PREV</span></div>
                <div class="ctrl-btn" id="play-pause-btn"><i class="fas fa-play"></i> <span style="margin-left:4px">PLAY</span></div>
                <div class="ctrl-btn" id="next-btn"><i class="fas fa-forward-step"></i> <span style="margin-left:4px">NEXT</span></div>
                <div class="ctrl-btn" id="loop-btn"><i class="fas fa-repeat"></i> <span style="margin-left:4px">LOOP</span></div>
                <div class="ctrl-btn" id="upload-btn"><i class="fas fa-plus-circle"></i> <span style="margin-left:4px">ADD</span></div>
                <div class="ctrl-btn install-btn" id="install-btn" style="display:none"><i class="fas fa-download"></i> <span style="margin-left:4px">APP</span></div>
            </div>
        </div>
    </div>

    <div class="bottom-area">
        <div class="playlist-container" id="playlist-container"></div>
        <div class="volume-sidebar" id="volume-sidebar">
            <div class="sys-vol-label">VOLUME</div>
            <div class="led-container" id="led-container"></div>
            <div class="vol-percent" id="vol-percent">50%</div>
            <div class="sys-vol-badge linked" id="sys-vol-badge"><i class="fas fa-link"></i> LINK</div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>
<div class="loading-overlay" id="loading-overlay"><div class="loading-spinner"></div></div>

<!-- Install Banner -->
<div class="install-banner" id="install-banner">
    <i class="fas fa-mobile-alt" style="color:#00e676;font-size:1.3rem"></i>
    <span class="install-banner-text">Cài NMC Pro ra màn hình?</span>
    <button class="install-banner-btn" id="install-banner-yes">Cài đặt</button>
    <span class="install-banner-close" id="install-banner-close"><i class="fas fa-times"></i></span>
</div>

<!-- Modal upload nhạc -->
<div id="upload-modal" class="modal">
    <div class="modal-content">
        <h3>THÊM NHẠC</h3>
        <div class="file-upload" id="file-upload-area">
            <i class="fas fa-cloud-upload-alt"></i> Chọn hoặc kéo file âm thanh vào đây
            <br><small style="color:#666;margin-top:8px;display:inline-block">Hỗ trợ: MP3, WAV, FLAC, OGG, AAC, M4A, WMA, OPUS, AIFF...</small>
        </div>
        <div class="input-group">
            <label>Tên hiển thị (tùy chọn)</label>
            <input type="text" id="song-title-input" placeholder="Tên bài hát">
        </div>
        <div class="modal-actions">
            <button class="btn-modal cancel" id="close-modal">Hủy</button>
            <button class="btn-modal" id="confirm-upload">Thêm</button>
        </div>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.flac,.ogg,.aac,.m4a,.wma,.opus,.aiff,.ape,.alac,.mid,.midi" multiple>
    </div>
</div>

<!-- Modal cài đặt bài hát -->
<div id="song-settings-modal" class="modal">
    <div class="modal-content">
        <h3>CÀI ĐẶT BÀI HÁT</h3>
        <div class="input-group">
            <label><i class="fas fa-tag"></i> Tên bài</label>
            <input type="text" id="settings-song-name" readonly disabled style="background:#1e1e2e;">
        </div>
        <div class="input-group">
            <label><i class="fas fa-play-circle"></i> Bắt đầu (giây)</label>
            <input type="number" id="settings-start-time" step="0.1" min="0" value="0">
        </div>
        <div class="input-group">
            <label><i class="fas fa-stop-circle"></i> Kết thúc (giây) - <span style="color:#ff0055">0 = hết bài</span></label>
            <input type="number" id="settings-end-time" step="0.1" min="0" value="0">
        </div>
        <div class="modal-actions">
            <button class="btn-modal danger" id="delete-song-btn"><i class="fas fa-trash-alt"></i> Xoá bài</button>
            <button class="btn-modal cancel" id="close-settings-modal">Hủy</button>
            <button class="btn-modal" id="save-settings-btn">Lưu</button>
        </div>
    </div>
</div>

<script>
    // ===================== IndexedDB - Persistent Storage =====================
    const DB_NAME = 'NMCMusicDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'songs';

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function saveSongToDB(songData) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(songData);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function deleteSongFromDB(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function getAllSongsFromDB() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    // ===================== Data =====================
    let playlist = [];  // { id, name, startTime, endTime, fileSize, fileType }
    let currentIndex = 0;
    let isPlaying = false;
    let loopMode = false;
    let audio = new Audio();
    audio.preload = 'auto';
    audio.crossOrigin = 'anonymous';

    let analyser = null;
    let sourceNode = null;
    let gainNode = null;
    let audioContext = null;
    let animationId = null;
    let ringCtx = null;
    let barsArray = [];

    let systemVolumeLinked = true;
    let currentVolume = 0.5;
    let editingSongIndex = -1;

    // Fade state
    let fadeAnimationId = null;
    let isFading = false;

    // Full Visualizer
    const fullCanvas = document.getElementById('fullVizCanvas');
    let fullCtx = fullCanvas.getContext('2d');
    let particles = [];

    function resizeFullCanvas() {
        fullCanvas.width = window.innerWidth;
        fullCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFullCanvas);
    resizeFullCanvas();

    class Particle {
        constructor(x, y, vx, vy, size, color) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.size = size; this.color = color; this.alpha = 0.6;
        }
        update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.005; }
        draw(ctx) {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ===================== DOM Elements =====================
    const playPauseBtn = document.getElementById('play-pause-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const loopBtn = document.getElementById('loop-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const installBtn = document.getElementById('install-btn');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeSpan = document.getElementById('current-time');
    const durationSpan = document.getElementById('duration-time');
    const songTitleDisplay = document.getElementById('current-song-title');
    const playlistContainer = document.getElementById('playlist-container');
    const volPercentSpan = document.getElementById('vol-percent');
    const ledContainer = document.getElementById('led-container');
    const sysVolBadge = document.getElementById('sys-vol-badge');
    const visualizerDiv = document.getElementById('visualizerBars');
    const ringCanvas = document.getElementById('ringCanvas');
    ringCtx = ringCanvas.getContext('2d');

    for (let i = 0; i < 32; i++) {
        const bar = document.createElement('div');
        bar.classList.add('visual-bar');
        visualizerDiv.appendChild(bar);
        barsArray.push(bar);
    }

    // ===================== Audio Context with GainNode =====================
    function setupAudioContext() {
        if (audioContext && audioContext.state !== 'closed') return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.8;
        gainNode = audioContext.createGain();
        gainNode.gain.value = currentVolume;
        sourceNode = audioContext.createMediaElementSource(audio);
        // Chain: source -> gain -> analyser -> destination
        sourceNode.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioContext.destination);
        if (audioContext.state === 'suspended') audioContext.resume();
    }

    // ===================== Volume Control with GainNode =====================
    function updateVolumeUI() {
        let vol = currentVolume;
        volPercentSpan.innerText = Math.round(vol * 100) + '%';
        const ledCount = 10;
        const activeCount = Math.floor(vol * ledCount);
        const ledBars = document.querySelectorAll('.led-bar');
        ledBars.forEach((led, idx) => {
            if (idx < activeCount) {
                led.classList.add('active');
                if (vol <= 0.33) led.style.backgroundColor = '#00e676';
                else if (vol <= 0.66) led.style.backgroundColor = '#ffea00';
                else led.style.backgroundColor = '#ff1744';
            } else {
                led.classList.remove('active');
                led.style.backgroundColor = '#1a1a1a';
            }
        });
        if (systemVolumeLinked) {
            sysVolBadge.className = 'sys-vol-badge linked';
            sysVolBadge.innerHTML = '<i class="fas fa-link"></i> LINKED';
        } else {
            sysVolBadge.className = 'sys-vol-badge unlinked';
            sysVolBadge.innerHTML = '<i class="fas fa-unlink"></i> MANUAL';
        }
    }

    function buildLEDs() {
        ledContainer.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const led = document.createElement('div');
            led.classList.add('led-bar');
            ledContainer.appendChild(led);
        }
        updateVolumeUI();
    }
    buildLEDs();

    function setVolume(vol) {
        vol = Math.min(1, Math.max(0, vol));
        currentVolume = vol;
        // Use GainNode for smooth volume control
        if (gainNode) {
            gainNode.gain.setValueAtTime(vol, audioContext.currentTime);
        }
        // Also set audio.volume as fallback (and for system volume sync)
        if (audio) audio.volume = systemVolumeLinked ? vol : vol;
        updateVolumeUI();
    }

    // Toggle system volume linking
    sysVolBadge.addEventListener('click', () => {
        systemVolumeLinked = !systemVolumeLinked;
        showToast(systemVolumeLinked ? "Đã liên kết âm lượng hệ thống" : "Âm lượng thủ công");
        if (systemVolumeLinked) {
            audio.volume = currentVolume;
        }
        updateVolumeUI();
    });

    // Volume sidebar touch/mouse
    const volumeSidebar = document.getElementById('volume-sidebar');
    let isDraggingVolume = false;
    function handleVolumeMove(clientY, rect) {
        let yRelative = (rect.bottom - clientY) / rect.height;
        yRelative = Math.min(1, Math.max(0, yRelative));
        setVolume(yRelative);
    }
    volumeSidebar.addEventListener('mousedown', (e) => {
        isDraggingVolume = true;
        handleVolumeMove(e.clientY, volumeSidebar.getBoundingClientRect());
        e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
        if (isDraggingVolume) handleVolumeMove(e.clientY, volumeSidebar.getBoundingClientRect());
    });
    window.addEventListener('mouseup', () => { isDraggingVolume = false; });
    volumeSidebar.addEventListener('touchstart', (e) => {
        isDraggingVolume = true;
        handleVolumeMove(e.touches[0].clientY, volumeSidebar.getBoundingClientRect());
        e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (isDraggingVolume && e.touches.length) {
            handleVolumeMove(e.touches[0].clientY, volumeSidebar.getBoundingClientRect());
        }
    });
    window.addEventListener('touchend', () => { isDraggingVolume = false; });

    // ===================== Fade In/Out using GainNode (SMOOTH) =====================
    function cancelFade() {
        if (fadeAnimationId) {
            cancelAnimationFrame(fadeAnimationId);
            fadeAnimationId = null;
        }
        isFading = false;
    }

    function fadeAudio(from, to, duration, callback) {
        cancelFade();
        isFading = true;
        const startTime = performance.now();

        function animateFade(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // Use ease-in-out curve for smoother fade
            const eased = progress < 0.5
                ? 2 * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            const currentVal = from + (to - from) * eased;

            if (gainNode && audioContext) {
                gainNode.gain.setValueAtTime(currentVal, audioContext.currentTime);
            }
            audio.volume = systemVolumeLinked ? currentVal : currentVal;

            if (progress < 1) {
                fadeAnimationId = requestAnimationFrame(animateFade);
            } else {
                isFading = false;
                fadeAnimationId = null;
                if (callback) callback();
            }
        }
        fadeAnimationId = requestAnimationFrame(animateFade);
    }

    // ===================== Load Song with Smooth Fade Out/In =====================
    let isSwitchingSong = false;

    function loadSongWithFade(index, autoPlay = true) {
        if (!playlist[index] || isSwitchingSong) return;
        isSwitchingSong = true;
        const wasPlaying = isPlaying;

        const doLoad = () => {
            audio.pause();
            isPlaying = false;
            const song = playlist[index];
            currentIndex = index;
            loadSongAudio(song).then(() => {
                songTitleDisplay.innerText = song.name;
                // Set volume to 0 for fade-in
                if (gainNode) gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                audio.volume = 0;

                if (autoPlay) {
                    audio.play().then(() => {
                        isPlaying = true;
                        updatePlayPauseUI();
                        updatePlaylistUI();
                        // Fade in smoothly
                        fadeAudio(0, currentVolume, 400, () => {
                            isSwitchingSong = false;
                        });
                        setupMediaSession(song);
                    }).catch(e => {
                        console.log('Play error:', e);
                        isSwitchingSong = false;
                    });
                } else {
                    isSwitchingSong = false;
                }
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                audio.addEventListener('canplaythrough', function onReady() {
                    audio.removeEventListener('canplaythrough', onReady);
                    if (audio.duration && isFinite(audio.duration)) {
                        durationSpan.innerText = formatTime(audio.duration);
                        const start = song.startTime || 0;
                        if (start > 0 && audio.currentTime < start) audio.currentTime = start;
                    }
                });
                updatePlaylistUI();
            }).catch(e => {
                console.error('Load song error:', e);
                isSwitchingSong = false;
                showToast('Lỗi tải bài hát');
            });
        };

        // If currently playing, fade out first then load new song
        if (audio.src && audio.readyState > 0 && (isPlaying || isFading)) {
            fadeAudio(gainNode ? gainNode.gain.value : audio.volume, 0, 250, doLoad);
        } else {
            doLoad();
        }
    }

    // Load audio from IndexedDB
    async function loadSongAudio(song) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(song.id);
            req.onsuccess = () => {
                if (req.result && req.result.blob) {
                    const url = URL.createObjectURL(req.result.blob);
                    audio.src = url;
                    audio.load();
                    resolve();
                } else {
                    reject(new Error('Song data not found'));
                }
            };
            req.onerror = () => reject(req.error);
        });
    }

    // ===================== Playlist UI =====================
    function updatePlaylistUI() {
        playlistContainer.innerHTML = '';
        playlist.forEach((song, idx) => {
            const btn = document.createElement('div');
            btn.classList.add('song-btn');
            if (idx === currentIndex && isPlaying) btn.classList.add('playing');
            btn.innerHTML = `<div class="song-name">${escapeHtml(song.name)}</div>`;
            const settingsIcon = document.createElement('div');
            settingsIcon.className = 'song-settings-icon';
            settingsIcon.innerHTML = '<i class="fas fa-cog"></i>';
            settingsIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                openSongSettings(idx);
            });
            btn.appendChild(settingsIcon);
            btn.addEventListener('click', () => {
                if (currentIndex === idx && isPlaying) {
                    pauseAudio();
                } else {
                    loadSongWithFade(idx, true);
                }
            });
            playlistContainer.appendChild(btn);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return map[m] || m;
        });
    }

    // ===================== Playback Controls =====================
    function playAudio() {
        if (!playlist.length) { showToast("Hãy thêm nhạc trước"); return; }
        if (!audio.src || audio.src === window.location.href) {
            loadSongWithFade(currentIndex, true);
            return;
        }
        const song = playlist[currentIndex];
        const start = song.startTime || 0;
        if (audio.readyState >= 2 && audio.currentTime < start) audio.currentTime = start;
        // Fade in from current gain
        const currentGain = gainNode ? gainNode.gain.value : 0;
        fadeAudio(currentGain, currentVolume, 200);
        audio.play().then(() => {
            isPlaying = true;
            updatePlayPauseUI();
            updatePlaylistUI();
            setupMediaSession(song);
        }).catch(e => console.log(e));
        if (audioContext && audioContext.state === 'suspended') audioContext.resume();
    }

    function pauseAudio() {
        // Fade out then pause
        const currentGain = gainNode ? gainNode.gain.value : audio.volume;
        fadeAudio(currentGain, 0, 150, () => {
            audio.pause();
            isPlaying = false;
            updatePlayPauseUI();
            updatePlaylistUI();
        });
    }

    function updatePlayPauseUI() {
        const icon = playPauseBtn.querySelector('i');
        const span = playPauseBtn.querySelector('span');
        if (isPlaying) {
            icon.className = 'fas fa-pause';
            span.innerText = 'PAUSE';
        } else {
            icon.className = 'fas fa-play';
            span.innerText = 'PLAY';
        }
    }

    function nextSong() {
        if (!playlist.length) return;
        if (loopMode) {
            const song = playlist[currentIndex];
            const start = song.startTime || 0;
            audio.currentTime = start;
            if (!isPlaying) playAudio();
            return;
        }
        let newIndex = currentIndex + 1;
        if (newIndex >= playlist.length) newIndex = 0;
        loadSongWithFade(newIndex, true);
    }

    function prevSong() {
        if (!playlist.length) return;
        // If played more than 3 seconds, restart current song
        if (audio.currentTime > 3) {
            const song = playlist[currentIndex];
            const start = song.startTime || 0;
            audio.currentTime = start;
            return;
        }
        let newIndex = currentIndex - 1;
        if (newIndex < 0) newIndex = playlist.length - 1;
        loadSongWithFade(newIndex, true);
    }

    function enforceSongBounds() {
        if (!playlist[currentIndex]) return;
        const song = playlist[currentIndex];
        const start = song.startTime || 0;
        const end = song.endTime || 0;
        if (end > 0 && audio.currentTime >= end) {
            if (loopMode) {
                audio.currentTime = start;
                audio.play();
            } else {
                nextSong();
            }
            return;
        }
        if (audio.currentTime < start) audio.currentTime = start;
    }

    // ===================== Media Session API (system volume + lock screen controls) =====================
    function setupMediaSession(song) {
        if (!('mediaSession' in navigator)) return;
        navigator.mediaSession.metadata = new MediaMetadata({
            title: song.name,
            artist: 'NMC Pro Player',
            album: 'My Music'
        });
        navigator.mediaSession.setActionHandler('play', () => playAudio());
        navigator.mediaSession.setActionHandler('pause', () => pauseAudio());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
        navigator.mediaSession.setActionHandler('seekto', (details) => {
            if (audio.duration && isFinite(audio.duration)) {
                audio.currentTime = details.seekTime;
            }
        });
    }

    // ===================== Event Listeners =====================
    playPauseBtn.addEventListener('click', () => {
        if (!playlist.length) { showToast("Hãy thêm nhạc trước"); return; }
        if (isPlaying) pauseAudio();
        else playAudio();
    });
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);
    loopBtn.addEventListener('click', () => {
        loopMode = !loopMode;
        if (loopMode) loopBtn.classList.add('active-loop');
        else loopBtn.classList.remove('active-loop');
        showToast(loopMode ? "Lặp lại bài hiện tại" : "Tắt lặp");
    });

    let isSeeking = false;
    seekSlider.addEventListener('mousedown', () => { isSeeking = true; });
    seekSlider.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });
    seekSlider.addEventListener('input', (e) => {
        if (audio.duration && isFinite(audio.duration)) {
            let newTime = (e.target.value / 100) * audio.duration;
            const song = playlist[currentIndex];
            const start = song?.startTime || 0;
            const end = song?.endTime || 0;
            if (newTime < start) newTime = start;
            if (end > 0 && newTime > end) newTime = end;
            audio.currentTime = newTime;
            currentTimeSpan.innerText = formatTime(newTime);
        }
    });
    seekSlider.addEventListener('mouseup', () => { isSeeking = false; });
    seekSlider.addEventListener('touchend', () => { isSeeking = false; });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration && isFinite(audio.duration) && !isSeeking) {
            let percent = (audio.currentTime / audio.duration) * 100;
            seekSlider.value = percent;
            currentTimeSpan.innerText = formatTime(audio.currentTime);
            document.getElementById('current-time-display').innerHTML = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            enforceSongBounds();
        }
    });

    audio.addEventListener('ended', () => {
        if (loopMode) {
            const song = playlist[currentIndex];
            const start = song.startTime || 0;
            audio.currentTime = start;
            audio.play();
        } else {
            nextSong();
        }
    });

    audio.addEventListener('error', (e) => {
        console.error('Audio error:', e);
        showToast('Lỗi phát âm thanh, thử bài khác');
    });

    // ===================== Upload Modal =====================
    const modalUpload = document.getElementById('upload-modal');
    const closeModalUpload = document.getElementById('close-modal');
    const confirmUpload = document.getElementById('confirm-upload');
    const fileUploadArea = document.getElementById('file-upload-area');
    const fileInput = document.getElementById('file-input');
    let selectedFiles = [];

    uploadBtn.addEventListener('click', () => {
        modalUpload.style.display = 'flex';
    });
    closeModalUpload.addEventListener('click', () => {
        modalUpload.style.display = 'none';
        selectedFiles = [];
        document.getElementById('song-title-input').value = '';
        fileInput.value = '';
    });
    fileUploadArea.addEventListener('click', () => {
        fileInput.click();
    });

    // Drag and drop support
    fileUploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileUploadArea.classList.add('drag-over');
    });
    fileUploadArea.addEventListener('dragleave', () => {
        fileUploadArea.classList.remove('drag-over');
    });
    fileUploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        fileUploadArea.classList.remove('drag-over');
        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|flac|ogg|aac|m4a|wma|opus|aiff|ape|alac|mid|midi)$/i.test(f.name));
        if (files.length) {
            selectedFiles = files;
            fileUploadArea.innerHTML = `<i class="fas fa-check-circle"></i> Đã chọn ${files.length} file`;
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            selectedFiles = Array.from(e.target.files);
            fileUploadArea.innerHTML = `<i class="fas fa-check-circle"></i> Đã chọn ${selectedFiles.length} file`;
        }
    });

    confirmUpload.addEventListener('click', async () => {
        if (!selectedFiles.length) { showToast("Chọn file âm thanh"); return; }
        const customName = document.getElementById('song-title-input').value.trim();
        showLoading(true);

        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            const songName = (selectedFiles.length === 1 && customName)
                ? customName
                : file.name.replace(/\.[^/.]+$/, "");
            const songId = 'song_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2, 6);

            try {
                // Save to IndexedDB
                await saveSongToDB({
                    id: songId,
                    name: songName,
                    blob: file,
                    fileSize: file.size,
                    fileType: file.type,
                    startTime: 0,
                    endTime: 0,
                    addedAt: Date.now()
                });

                playlist.push({
                    id: songId,
                    name: songName,
                    startTime: 0,
                    endTime: 0,
                    fileSize: file.size,
                    fileType: file.type
                });
            } catch (e) {
                console.error('Save error:', e);
                showToast('Lỗi lưu: ' + songName);
            }
        }

        showLoading(false);
        modalUpload.style.display = 'none';
        selectedFiles = [];
        document.getElementById('song-title-input').value = '';
        fileInput.value = '';
        fileUploadArea.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Chọn hoặc kéo file âm thanh vào đây<br><small style="color:#666;margin-top:8px;display:inline-block">Hỗ trợ: MP3, WAV, FLAC, OGG, AAC, M4A, WMA, OPUS, AIFF...</small>';

        updatePlaylistUI();
        if (playlist.length === selectedFiles.length || (!isPlaying && playlist.length > 0)) {
            currentIndex = playlist.length - 1;
            loadSongWithFade(currentIndex, true);
        }
        showToast(`Đã thêm ${selectedFiles.length || playlist.length} bài hát`);
    });

    // ===================== Song Settings Modal =====================
    const settingsModal = document.getElementById('song-settings-modal');
    const closeSettings = document.getElementById('close-settings-modal');
    const saveSettings = document.getElementById('save-settings-btn');
    const deleteBtn = document.getElementById('delete-song-btn');

    function openSongSettings(index) {
        editingSongIndex = index;
        const song = playlist[index];
        document.getElementById('settings-song-name').value = song.name;
        document.getElementById('settings-start-time').value = (song.startTime || 0);
        document.getElementById('settings-end-time').value = (song.endTime || 0);
        settingsModal.style.display = 'flex';
    }

    async function saveSongSettings() {
        if (editingSongIndex === -1) return;
        const song = playlist[editingSongIndex];
        let start = parseFloat(document.getElementById('settings-start-time').value);
        let end = parseFloat(document.getElementById('settings-end-time').value);
        if (isNaN(start)) start = 0;
        if (isNaN(end)) end = 0;
        if (end < 0) end = 0;
        if (start < 0) start = 0;
        if (end > 0 && end <= start) {
            showToast("Kết thúc phải lớn hơn bắt đầu, đã đặt lại = 0");
            end = 0;
        }
        song.startTime = start;
        song.endTime = end;
        // Save settings to IndexedDB
        try {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(song.id);
            req.onsuccess = () => {
                if (req.result) {
                    req.result.startTime = start;
                    req.result.endTime = end;
                    store.put(req.result);
                }
            };
        } catch (e) { console.error(e); }

        if (editingSongIndex === currentIndex && audio.src) {
            if (audio.currentTime < start) audio.currentTime = start;
            if (end > 0 && audio.currentTime >= end) {
                if (loopMode) audio.currentTime = start;
                else nextSong();
            }
        }
        showToast(`Đã lưu cài đặt cho "${song.name}"`);
        settingsModal.style.display = 'none';
        editingSongIndex = -1;
    }

    async function deleteCurrentSong() {
        if (editingSongIndex === -1) return;
        const removed = playlist.splice(editingSongIndex, 1)[0];
        // Delete from IndexedDB
        try { await deleteSongFromDB(removed.id); } catch (e) { console.error(e); }
        showToast(`Đã xoá "${removed.name}"`);
        if (playlist.length === 0) {
            audio.pause();
            audio.src = '';
            isPlaying = false;
            currentIndex = 0;
            songTitleDisplay.innerText = "Chọn bài hát";
            updatePlayPauseUI();
        } else {
            if (editingSongIndex < currentIndex) currentIndex--;
            else if (editingSongIndex === currentIndex) {
                if (currentIndex >= playlist.length) currentIndex = playlist.length - 1;
                if (currentIndex >= 0) loadSongWithFade(currentIndex, true);
                else { audio.pause(); isPlaying = false; }
            }
        }
        settingsModal.style.display = 'none';
        editingSongIndex = -1;
        updatePlaylistUI();
    }

    closeSettings.addEventListener('click', () => {
        settingsModal.style.display = 'none';
        editingSongIndex = -1;
    });
    saveSettings.addEventListener('click', saveSongSettings);
    deleteBtn.addEventListener('click', deleteCurrentSong);

    // ===================== PWA - Install to Home Screen =====================
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Show install button and banner
        installBtn.style.display = 'flex';
        setTimeout(() => {
            document.getElementById('install-banner').classList.add('show');
        }, 2000);
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) {
            showToast('Mục > Thêm ra màn hình chính');
            return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            showToast('Đã cài đặt NMC Pro!');
            installBtn.style.display = 'none';
        }
        deferredPrompt = null;
    });

    document.getElementById('install-banner-yes').addEventListener('click', async () => {
        document.getElementById('install-banner').classList.remove('show');
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                showToast('Đã cài đặt NMC Pro!');
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });

    document.getElementById('install-banner-close').addEventListener('click', () => {
        document.getElementById('install-banner').classList.remove('show');
    });

    window.addEventListener('appinstalled', () => {
        showToast('NMC Pro đã được cài đặt!');
        installBtn.style.display = 'none';
        deferredPrompt = null;
    });

    // ===================== Service Worker Registration =====================
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'nmc-music-v1';
            const ASSETS = [self.location.href];
            self.addEventListener('install', e => {
                e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS)));
                self.skipWaiting();
            });
            self.addEventListener('activate', e => {
                e.waitUntil(caches.keys().then(names => 
                    Promise.all(names.filter(n => n !== CACHE_NAME).map(n => caches.delete(n)))
                ));
                self.clients.claim();
            });
            self.addEventListener('fetch', e => {
                if (e.request.method !== 'GET') return;
                e.respondWith(
                    caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
                        const clone = resp.clone();
                        caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
                        return resp;
                    }).catch(() => caches.match(e.request)))
                );
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).then(reg => {
            console.log('SW registered');
        }).catch(err => {
            console.log('SW registration failed (expected on file://):', err.message);
        });
    }

    // ===================== Visualizers =====================
    let freqData = new Uint8Array(64);

    function drawFullVisualizer() {
        if (!analyser) {
            requestAnimationFrame(drawFullVisualizer);
            return;
        }
        analyser.getByteFrequencyData(freqData);
        fullCtx.clearRect(0, 0, fullCanvas.width, fullCanvas.height);

        let gradient = fullCtx.createLinearGradient(0, 0, fullCanvas.width, fullCanvas.height);
        gradient.addColorStop(0, 'rgba(10, 10, 20, 0.2)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
        fullCtx.fillStyle = gradient;
        fullCtx.fillRect(0, 0, fullCanvas.width, fullCanvas.height);

        const centerX = fullCanvas.width / 2;
        const centerY = fullCanvas.height / 2;
        const maxRadius = Math.min(fullCanvas.width, fullCanvas.height) * 0.4;

        for (let i = 0; i < 64; i++) {
            let val = freqData[i] / 255;
            let barHeight = 10 + val * 80;
            let angle = (i / 64) * Math.PI * 2;
            let rad = maxRadius + barHeight * 0.6;
            let x1 = centerX + Math.cos(angle) * (maxRadius - 8);
            let y1 = centerY + Math.sin(angle) * (maxRadius - 8);
            let x2 = centerX + Math.cos(angle) * rad;
            let y2 = centerY + Math.sin(angle) * rad;
            fullCtx.beginPath();
            fullCtx.moveTo(x1, y1);
            fullCtx.lineTo(x2, y2);
            fullCtx.lineWidth = 4;
            fullCtx.strokeStyle = `hsl(${320 + val * 80}, 100%, 60%)`;
            fullCtx.shadowBlur = 12;
            fullCtx.shadowColor = '#ff0055';
            fullCtx.stroke();
        }
        fullCtx.shadowBlur = 0;

        if (freqData.reduce((a, b) => a + b, 0) > 200) {
            for (let i = 0; i < 3; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1 + Math.random() * 3;
                let size = 2 + Math.random() * 4;
                particles.push(new Particle(centerX, centerY, Math.cos(angle) * speed, Math.sin(angle) * speed, size, `hsl(${Math.random() * 60 + 300}, 80%, 60%)`));
            }
        }
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw(fullCtx);
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(drawFullVisualizer);
    }
    drawFullVisualizer();

    function updateBarsVisualizer() {
        if (!analyser) { requestAnimationFrame(updateBarsVisualizer); return; }
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        const step = Math.floor(data.length / barsArray.length);
        for (let i = 0; i < barsArray.length; i++) {
            let val = data[i * step] || 0;
            let height = (val / 255) * 80 + 4;
            barsArray[i].style.height = height + 'px';
            barsArray[i].style.backgroundColor = `hsl(${320 + (val / 255) * 40}, 100%, 60%)`;
        }
        if (ringCtx) {
            ringCtx.clearRect(0, 0, 160, 160);
            let avg = 0;
            for (let i = 0; i < data.length; i++) avg += data[i];
            avg /= data.length;
            let rad = 40 + (avg / 255) * 50;
            ringCtx.beginPath();
            ringCtx.arc(80, 80, rad, 0, Math.PI * 2);
            ringCtx.strokeStyle = `rgba(255,0,85,${0.3 + avg / 500})`;
            ringCtx.lineWidth = 3;
            ringCtx.stroke();
            for (let i = 0; i < 12; i++) {
                let angle = (Date.now() / 300 + i) % (Math.PI * 2);
                let r = 70 + (avg / 255) * 20;
                let x = 80 + Math.cos(angle) * r;
                let y = 80 + Math.sin(angle) * r;
                ringCtx.fillStyle = '#ff0055';
                ringCtx.beginPath();
                ringCtx.arc(x, y, 3 + avg / 80, 0, Math.PI * 2);
                ringCtx.fill();
            }
        }
        requestAnimationFrame(updateBarsVisualizer);
    }
    updateBarsVisualizer();

    // ===================== Utility Functions =====================
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return "0:00";
        let mins = Math.floor(sec / 60);
        let secs = Math.floor(sec % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function showLoading(show) {
        document.getElementById('loading-overlay').classList.toggle('show', show);
    }

    // ===================== Initialize App =====================
    async function initApp() {
        // Restore saved volume
        const savedVol = localStorage.getItem('nmc_volume');
        if (savedVol !== null) {
            currentVolume = parseFloat(savedVol);
            if (isNaN(currentVolume)) currentVolume = 0.5;
        }

        const savedLoop = localStorage.getItem('nmc_loop');
        if (savedLoop === 'true') {
            loopMode = true;
            loopBtn.classList.add('active-loop');
        }

        // Setup audio context (needs user interaction first)
        const initAudioCtx = () => {
            setupAudioContext();
            document.removeEventListener('click', initAudioCtx);
            document.removeEventListener('touchstart', initAudioCtx);
        };
        document.addEventListener('click', initAudioCtx);
        document.addEventListener('touchstart', initAudioCtx);

        // Load songs from IndexedDB
        try {
            const savedSongs = await getAllSongsFromDB();
            if (savedSongs.length > 0) {
                playlist = savedSongs.map(s => ({
                    id: s.id,
                    name: s.name,
                    startTime: s.startTime || 0,
                    endTime: s.endTime || 0,
                    fileSize: s.fileSize || 0,
                    fileType: s.fileType || ''
                }));
                showToast(`Đã tải ${playlist.length} bài hát từ bộ nhớ`);
            }
        } catch (e) {
            console.error('Load songs error:', e);
        }

        setVolume(currentVolume);
        updatePlaylistUI();

        // Restore last playing song index
        const savedIndex = localStorage.getItem('nmc_currentIndex');
        if (savedIndex !== null) {
            const idx = parseInt(savedIndex);
            if (idx >= 0 && idx < playlist.length) {
                currentIndex = idx;
                const song = playlist[currentIndex];
                songTitleDisplay.innerText = song.name;
            }
        }

        // Save volume on change
        setInterval(() => {
            localStorage.setItem('nmc_volume', currentVolume.toString());
            localStorage.setItem('nmc_loop', loopMode.toString());
            localStorage.setItem('nmc_currentIndex', currentIndex.toString());
        }, 2000);
    }

    initApp();

    // ===================== Keyboard Shortcuts =====================
    document.addEventListener('keydown', (e) => {
        switch (e.code) {
            case 'Space':
                e.preventDefault();
                if (isPlaying) pauseAudio();
                else playAudio();
                break;
            case 'ArrowLeft':
                e.preventDefault();
                prevSong();
                break;
            case 'ArrowRight':
                e.preventDefault();
                nextSong();
                break;
            case 'ArrowUp':
                e.preventDefault();
                setVolume(currentVolume + 0.05);
                break;
            case 'ArrowDown':
                e.preventDefault();
                setVolume(currentVolume - 0.05);
                break;
            case 'KeyL':
                loopMode = !loopMode;
                if (loopMode) loopBtn.classList.add('active-loop');
                else loopBtn.classList.remove('active-loop');
                showToast(loopMode ? "Lặp lại bài hiện tại" : "Tắt lặp");
                break;
        }
    });
</script>
