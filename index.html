<body>
<canvas id="fullVizCanvas" class="full-viz-canvas"></canvas>
<div class="app-container">
    <div class="main-screen">
        <div class="signature">NMC<span> PRO</span></div>
        <div class="top-info">
            <div class="song-title-display" id="current-song-title">Chọn bài hát</div>
            <div class="song-time-display" id="current-time-display">0:00 / 0:00</div>
        </div>
        <div class="visual-full" id="visualizerBars"></div>
        <div class="visual-ring"><canvas id="ringCanvas" width="160" height="160"></canvas></div>
        <div class="controls-area">
            <div class="progress-wrapper">
                <span class="progress-time" id="current-time">0:00</span>
                <input type="range" id="seek-slider" value="0" step="0.01">
                <span class="progress-time" id="duration-time">0:00</span>
            </div>
            <div class="control-row">
                <div class="ctrl-btn" id="prev-btn"><i class="fas fa-backward-step"></i></div>
                <div class="ctrl-btn" id="play-pause-btn"><i class="fas fa-play"></i></div>
                <div class="ctrl-btn" id="next-btn"><i class="fas fa-forward-step"></i></div>
                <div class="ctrl-btn" id="loop-btn"><i class="fas fa-repeat"></i></div>
                <div class="ctrl-btn" id="upload-btn"><i class="fas fa-plus"></i></div>
                <div class="ctrl-btn pin-btn" id="pin-btn" title="Ghim trên cùng"><i class="fas fa-thumbtack"></i></div>
                <div class="ctrl-btn install-btn" id="install-btn" style="display:none"><i class="fas fa-download"></i></div>
            </div>
        </div>
    </div>
    <div class="bottom-area">
        <div class="playlist-container" id="playlist-container"></div>
        <div class="volume-sidebar" id="volume-sidebar">
            <div class="sys-vol-label">VOLUME</div>
            <div class="led-container" id="led-container"></div>
            <div class="vol-percent" id="vol-percent">50%</div>
            <div class="sys-vol-badge linked" id="sys-vol-badge"><i class="fas fa-link"></i> LINK</div>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>
<div class="loading-overlay" id="loading-overlay"><div class="loading-spinner"></div></div>

<!-- Upload Modal -->
<div id="upload-modal" class="modal">
    <div class="modal-content">
        <h3>THÊM NHẠC</h3>
        <div class="file-upload" id="file-upload-area">
            <i class="fas fa-cloud-upload-alt"></i> Chọn hoặc kéo file vào đây
            <br><small style="color:#666;margin-top:6px;display:inline-block">MP3, WAV, FLAC, OGG, AAC, M4A, OPUS, AIFF...</small>
        </div>
        <div class="input-group">
            <label>Tên hiển thị (tùy chọn)</label>
            <input type="text" id="song-title-input" placeholder="Tên bài hát">
        </div>
        <div class="modal-actions">
            <button class="btn-modal cancel" id="close-modal">Hủy</button>
            <button class="btn-modal" id="confirm-upload">Thêm</button>
        </div>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.flac,.ogg,.aac,.m4a,.wma,.opus,.aiff,.ape,.alac,.mid,.midi" multiple>
    </div>
</div>

<!-- Settings Modal -->
<div id="song-settings-modal" class="modal">
    <div class="modal-content">
        <h3>CÀI ĐẶT BÀI HÁT</h3>
        <div class="input-group">
            <label><i class="fas fa-tag"></i> Tên bài</label>
            <input type="text" id="settings-song-name" readonly disabled style="background:#1e1e2e;">
        </div>
        <div class="input-group">
            <label><i class="fas fa-play-circle"></i> Bắt đầu (giây)</label>
            <input type="number" id="settings-start-time" step="0.1" min="0" value="0">
        </div>
        <div class="input-group">
            <label><i class="fas fa-stop-circle"></i> Kết thúc (giây) - <span style="color:#ff0055">0 = hết bài</span></label>
            <input type="number" id="settings-end-time" step="0.1" min="0" value="0">
        </div>
        <div class="modal-actions">
            <button class="btn-modal danger" id="delete-song-btn"><i class="fas fa-trash-alt"></i> Xoá</button>
            <button class="btn-modal cancel" id="close-settings-modal">Hủy</button>
            <button class="btn-modal" id="save-settings-btn">Lưu</button>
        </div>
    </div>
</div>

<!-- Install Guide Modal -->
<div id="install-guide-modal" class="modal">
    <div class="modal-content install-modal-content">
        <h3><i class="fas fa-mobile-alt" style="color:#00e676"></i> CÀI RA MÀN HÌNH</h3>
        <div id="install-steps"></div>
        <div class="modal-actions" style="margin-top:16px">
            <button class="btn-modal" id="install-action-btn" style="background:#00e676;color:#0a0a0f">Cài đặt ngay</button>
            <button class="btn-modal cancel" id="close-install-modal">Đóng</button>
        </div>
    </div>
</div>

// ===================== IndexedDB =====================
const DB_NAME = 'NMCMusicDB';
const DB_VERSION = 1;
const STORE_NAME = 'songs';

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function saveSongToDB(d) { const db = await openDB(); return new Promise((res,rej) => { const tx = db.transaction(STORE_NAME,'readwrite'); tx.objectStore(STORE_NAME).put(d); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function deleteSongFromDB(id) { const db = await openDB(); return new Promise((res,rej) => { const tx = db.transaction(STORE_NAME,'readwrite'); tx.objectStore(STORE_NAME).delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function getAllSongsFromDB() { const db = await openDB(); return new Promise((res,rej) => { const tx = db.transaction(STORE_NAME,'readonly'); const r = tx.objectStore(STORE_NAME).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

// ===================== Audio Context + Dual GainNode (Crossfade) =====================
function setupAudioContext() {
    if (audioContext && audioContext.state !== 'closed') return;
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    // Player 1
    gainNode = audioContext.createGain();
    gainNode.gain.value = activeAudio === 'audio' ? currentVolume : 0;
    sourceNode = audioContext.createMediaElementSource(audio);
    sourceNode.connect(gainNode);
    gainNode.connect(analyser);
    // Player 2
    gainNode2 = audioContext.createGain();
    gainNode2.gain.value = activeAudio === 'audio2' ? currentVolume : 0;
    sourceNode2 = audioContext.createMediaElementSource(audio2);
    sourceNode2.connect(gainNode2);
    gainNode2.connect(analyser);
    analyser.connect(audioContext.destination);
    if (audioContext.state === 'suspended') audioContext.resume();
}

function updateVolumeUI() {
    volPercentSpan.innerText = Math.round(currentVolume * 100) + '%';
    const activeCount = Math.floor(currentVolume * 10);
    document.querySelectorAll('.led-bar').forEach((led, idx) => {
        if (idx < activeCount) {
            led.classList.add('active');
            led.style.backgroundColor = currentVolume <= .33 ? '#00e676' : currentVolume <= .66 ? '#ffea00' : '#ff1744';
        } else { led.classList.remove('active'); led.style.backgroundColor = '#1a1a1a'; }
    });
    sysVolBadge.className = systemVolumeLinked ? 'sys-vol-badge linked' : 'sys-vol-badge unlinked';
    sysVolBadge.innerHTML = systemVolumeLinked ? '<i class="fas fa-link"></i> LINK' : '<i class="fas fa-unlink"></i> MAN';
}

buildLEDs();

function setVolume(v) {
    v = Math.min(1, Math.max(0, v));
    currentVolume = v;
    const gn = getGN();
    if (gn && audioContext) {
        // Cancel any running ramps and set volume immediately
        gn.gain.cancelScheduledValues(audioContext.currentTime);
        gn.gain.setValueAtTime(Math.max(v, 0.0001), audioContext.currentTime);
    }
    updateVolumeUI();
}

// ===================== Crossfade (Dual Audio + GainNode) =====================
// Uses Web Audio API exponentialRampToValueAtTime for sample-accurate,
// click-free, perceptually smooth fade transitions.
const FADE_OUT_DURATION = 1.5;  // seconds — bài cũ nhỏ dần
const FADE_IN_DURATION = 2.0;   // seconds — bài mới lớn dần
const FADE_PLAY_DELAY = 0.15;   // seconds — delay before new song starts (overlap)

function cancelFade() {
    if (fadeAnimationId) { cancelAnimationFrame(fadeAnimationId); fadeAnimationId = null; }
    // Cancel any pending Web Audio ramps on both gain nodes
    if (audioContext) {
        const now = audioContext.currentTime;
        [gainNode, gainNode2].forEach(gn => {
            if (gn) {
                gn.gain.cancelScheduledValues(now);
                // Hold current value (don't ramp to zero — caller will set new ramps)
            }
        });
    }
    isFading = false;
    isSwitchingSong = false;  // Allow new song switches
}

// Smooth ramp on a specific GainNode using Web Audio API scheduling
function rampGain(gn, fromVal, toVal, duration, startTime) {
    if (!gn || !audioContext) return;
    const now = startTime || audioContext.currentTime;
    gn.gain.cancelScheduledValues(now);
    gn.gain.setValueAtTime(Math.max(fromVal, 0.0001), now);
    // exponentialRamp sounds natural (perceptual loudness is logarithmic)
    gn.gain.exponentialRampToValueAtTime(Math.max(toVal, 0.0001), now + duration);
}

async function loadSongAudioInto(el, song) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(song.id);
        req.onsuccess = () => { if (req.result?.blob) { el.src = URL.createObjectURL(req.result.blob); el.load(); resolve(); } else reject('No data'); };
        req.onerror = () => reject(req.error);
    });
}

let crossfadeCleanupId = null;

function loadSongWithFade(index, autoPlay = true) {
    if (!playlist[index] || isSwitchingSong) return;
    isSwitchingSong = true;
    cancelFade();
    // Cancel any pending crossfade cleanup
    if (crossfadeCleanupId) { clearTimeout(crossfadeCleanupId); crossfadeCleanupId = null; }

    const oldEl = getEl();
    const newEl = getEl2();
    const oldGain = getGN();
    const newGain = getGN2();
    const song = playlist[index];
    const hasCurrentAudio = oldEl.src && oldEl.readyState > 0 && isPlaying;

    // ===== IMMEDIATELY start fading out old song (no waiting for load) =====
    const oldStartVol = oldGain && audioContext ? oldGain.gain.value : currentVolume;
    if (hasCurrentAudio && oldGain && audioContext) {
        rampGain(oldGain, oldStartVol, 0.0001, FADE_OUT_DURATION);
    }

    loadSongAudioInto(newEl, song).then(() => {
        currentIndex = index;
        songTitleDisplay.innerText = song.name;

        // No current audio playing → simple fade in (first song or after stop)
        if (!hasCurrentAudio || !audioContext) {
            activeAudio = activeAudio === 'audio' ? 'audio2' : 'audio';
            const gn = getGN();
            if (gn && audioContext) {
                gn.gain.cancelScheduledValues(audioContext.currentTime);
                gn.gain.setValueAtTime(0.0001, audioContext.currentTime);
            }
            if (autoPlay) {
                newEl.play().then(() => {
                    isPlaying = true; updatePlayPauseUI(); updatePlaylistUI(); setupMediaSession(song);
                    if (gn && audioContext) {
                        rampGain(gn, 0.0001, currentVolume, FADE_IN_DURATION);
                    }
                    if (audioContext?.state === 'suspended') audioContext.resume();
                    // Mark switching done after fade-in
                    crossfadeCleanupId = setTimeout(() => { isSwitchingSong = false; crossfadeCleanupId = null; }, FADE_IN_DURATION * 1000);
                }).catch(e => { console.log(e); isSwitchingSong = false; });
            } else { isSwitchingSong = false; }
            updatePlaylistUI();
            newEl.addEventListener('canplaythrough', function h() {
                newEl.removeEventListener('canplaythrough', h);
                if (newEl.duration && isFinite(newEl.duration)) {
                    durationSpan.innerText = formatTime(newEl.duration);
                    const s = song.startTime || 0;
                    if (s > 0 && newEl.currentTime < s) newEl.currentTime = s;
                }
            });
            return;
        }

        // ===== CROSSFADE: old already fading out, now start new + fade in =====
        if (autoPlay) {
            // New song starts at near-zero volume
            if (newGain && audioContext) {
                newGain.gain.cancelScheduledValues(audioContext.currentTime);
                newGain.gain.setValueAtTime(0.0001, audioContext.currentTime);
            }
            newEl.play().then(() => {
                if (audioContext?.state === 'suspended') audioContext.resume();

                // Swap active so UI tracks new song
                activeAudio = activeAudio === 'audio' ? 'audio2' : 'audio';

                // Fade in new song smoothly
                if (newGain && audioContext) {
                    rampGain(newGain, 0.0001, currentVolume, FADE_IN_DURATION);
                }

                isFading = true;

                // After both fades complete, clean up
                const maxFade = Math.max(FADE_OUT_DURATION, FADE_IN_DURATION);
                crossfadeCleanupId = setTimeout(() => {
                    oldEl.pause(); oldEl.currentTime = 0;
                    if (oldGain && audioContext) {
                        oldGain.gain.cancelScheduledValues(audioContext.currentTime);
                        oldGain.gain.setValueAtTime(0.0001, audioContext.currentTime);
                    }
                    isFading = false; fadeAnimationId = null; isSwitchingSong = false;
                    isPlaying = true;
                    updatePlayPauseUI(); updatePlaylistUI(); setupMediaSession(song);
                    crossfadeCleanupId = null;
                }, maxFade * 1000 + 100);

            }).catch(e => { console.log(e); isSwitchingSong = false; });
        } else {
            activeAudio = activeAudio === 'audio' ? 'audio2' : 'audio';
            const gn = getGN();
            if (gn && audioContext) {
                gn.gain.cancelScheduledValues(audioContext.currentTime);
                gn.gain.setValueAtTime(0.0001, audioContext.currentTime);
            }
            isSwitchingSong = false;
            updatePlaylistUI();
        }

        newEl.addEventListener('canplaythrough', function h() {
            newEl.removeEventListener('canplaythrough', h);
            if (newEl.duration && isFinite(newEl.duration)) {
                durationSpan.innerText = formatTime(newEl.duration);
                const s = song.startTime || 0;
                if (s > 0 && newEl.currentTime < s) newEl.currentTime = s;
            }
        });
    }).catch(e => { console.error(e); isSwitchingSong = false; showToast('Lỗi tải bài hát'); });
}

// ===================== Playback =====================
function playAudio() {
    if (!playlist.length) { showToast('Hãy thêm nhạc trước'); return; }
    const el = getEl();
    if (!el.src || el.src === location.href) { loadSongWithFade(currentIndex, true); return; }
    const song = playlist[currentIndex];
    const s = song.startTime || 0;
    if (el.readyState >= 2 && el.currentTime < s) el.currentTime = s;
    const gn = getGN();
    if (gn && audioContext) {
        const curVol = gn.gain.value;
        rampGain(gn, Math.max(curVol, 0.0001), currentVolume, 0.3);
    }
    el.play().then(() => { isPlaying = true; updatePlayPauseUI(); updatePlaylistUI(); setupMediaSession(song); }).catch(e => console.log(e));
    if (audioContext?.state === 'suspended') audioContext.resume();
}

function pauseAudio() {
    const gn = getGN();
    if (gn && audioContext) {
        const curVol = Math.max(gn.gain.value, 0.0001);
        rampGain(gn, curVol, 0.0001, 0.4);
        setTimeout(() => { getEl().pause(); isPlaying = false; updatePlayPauseUI(); updatePlaylistUI(); }, 450);
    } else {
        getEl().pause(); isPlaying = false; updatePlayPauseUI(); updatePlaylistUI();
    }
}

function updatePlayPauseUI() {
    const i = playPauseBtn.querySelector('i');
    i.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
}

function nextSong() {
    if (!playlist.length) return;
    const el = getEl();
    if (loopMode) { const s = playlist[currentIndex].startTime || 0; el.currentTime = s; if (!isPlaying) playAudio(); return; }
    let n = currentIndex + 1; if (n >= playlist.length) n = 0;
    loadSongWithFade(n, true);
}

function prevSong() {
    if (!playlist.length) return;
    const el = getEl();
    if (el.currentTime > 3) { const s = playlist[currentIndex].startTime || 0; el.currentTime = s; return; }
    let n = currentIndex - 1; if (n < 0) n = playlist.length - 1;
    loadSongWithFade(n, true);
}

function enforceSongBounds() {
    if (!playlist[currentIndex]) return;
    const el = getEl();
    const s = playlist[currentIndex].startTime || 0, e = playlist[currentIndex].endTime || 0;
    if (e > 0 && el.currentTime >= e) { if (loopMode) { el.currentTime = s; el.play(); } else { isPlaying = false; nextSong(); } return; }
    if (el.currentTime < s) el.currentTime = s;
}

// ===================== Media Session =====================
function setupMediaSession(song) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: song.name, artist: 'NMC Pro Player', album: 'My Music' });
    navigator.mediaSession.setActionHandler('play', () => playAudio());
    navigator.mediaSession.setActionHandler('pause', () => pauseAudio());
    navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
}

function updatePlaylistUI() {
    playlistContainer.innerHTML = '';
    playlist.forEach((song, idx) => {
        const btn = document.createElement('div');
        btn.classList.add('song-btn');
        if (idx === currentIndex && isPlaying) btn.classList.add('playing');
        btn.innerHTML = `<div class="song-name">${escapeHtml(song.name)}</div>`;
        const ico = document.createElement('div');
        ico.className = 'song-settings-icon';
        ico.innerHTML = '<i class="fas fa-cog"></i>';
        ico.addEventListener('click', e => { e.stopPropagation(); openSongSettings(idx); });
        btn.appendChild(ico);
        btn.addEventListener('click', () => { if (currentIndex === idx && isPlaying) pauseAudio(); else loadSongWithFade(idx, true); });
        playlistContainer.appendChild(btn);
    });
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]||c); }

    const el = getEl();

        let t = (e.target.value / 100) * el.duration;
        const s = playlist[currentIndex]?.startTime || 0, end = playlist[currentIndex]?.endTime || 0;
        if (t < s) t = s; if (end > 0 && t > end) t = end;
        el.currentTime = t; currentTimeSpan.innerText = formatTime(t);
    }
});

function onTimeUpdate() {
    const el = getEl();
    if (this !== el) return; // ignore inactive player
    if (el.duration && isFinite(el.duration) && !isSeeking) {
        seekSlider.value = (el.currentTime / el.duration) * 100;
        currentTimeSpan.innerText = formatTime(el.currentTime);
        document.getElementById('current-time-display').innerHTML = `${formatTime(el.currentTime)} / ${formatTime(el.duration)}`;
        enforceSongBounds();
    }
}
function onEnded() {
    const el = getEl();
    if (this !== el) return;
    if (loopMode) { el.currentTime = playlist[currentIndex]?.startTime || 0; el.play(); } else {
        // When song ends naturally, start next with fade-in only (no fade-out needed, song already ended)
        isPlaying = false;
        nextSong();
    }
}

function openSongSettings(idx) {
    editingSongIndex = idx; const s = playlist[idx];
    document.getElementById('settings-song-name').value = s.name;
    document.getElementById('settings-start-time').value = s.startTime || 0;
    document.getElementById('settings-end-time').value = s.endTime || 0;

async function saveSongSettings() {
    if (editingSongIndex === -1) return;
    const s = playlist[editingSongIndex];
    let st = parseFloat(document.getElementById('settings-start-time').value) || 0;
    let en = parseFloat(document.getElementById('settings-end-time').value) || 0;
    if (en > 0 && en <= st) { showToast('Kết thúc phải lớn hơn bắt đầu'); en = 0; }
    s.startTime = st; s.endTime = en;
    try { const db = await openDB(); const tx = db.transaction(STORE_NAME,'readwrite'); const store = tx.objectStore(STORE_NAME); const r = store.get(s.id); r.onsuccess = () => { if (r.result) { r.result.startTime = st; r.result.endTime = en; store.put(r.result); } }; } catch(e){}
    if (editingSongIndex === currentIndex) { const el = getEl(); if (el.src) { if (el.currentTime < st) el.currentTime = st; if (en > 0 && el.currentTime >= en) { loopMode ? el.currentTime = st : nextSong(); } } }
    showToast(`Đã lưu: "${s.name}"`); settingsModal.style.display = 'none'; editingSongIndex = -1;
}

async function deleteCurrentSong() {
    if (editingSongIndex === -1) return;
    const rm = playlist.splice(editingSongIndex, 1)[0];
    try { await deleteSongFromDB(rm.id); } catch(e){}
    showToast(`Đã xoá "${rm.name}"`);
    if (!playlist.length) { audio.pause(); audio.src = ''; audio2.pause(); audio2.src = ''; isPlaying = false; currentIndex = 0; songTitleDisplay.innerText = 'Chọn bài hát'; updatePlayPauseUI(); }
    else { if (editingSongIndex < currentIndex) currentIndex--; else if (editingSongIndex === currentIndex) { if (currentIndex >= playlist.length) currentIndex = playlist.length - 1; if (currentIndex >= 0) loadSongWithFade(currentIndex, true); } }
    settingsModal.style.display = 'none'; editingSongIndex = -1; updatePlaylistUI();
}

// ===================== Visualizers =====================
let freqData = new Uint8Array(64);

function drawFullVisualizer() {
    if (!analyser) { requestAnimationFrame(drawFullVisualizer); return; }
    analyser.getByteFrequencyData(freqData);
    fullCtx.clearRect(0,0,fullCanvas.width,fullCanvas.height);
    let g = fullCtx.createLinearGradient(0,0,fullCanvas.width,fullCanvas.height);
    g.addColorStop(0,'rgba(10,10,20,0.2)'); g.addColorStop(1,'rgba(0,0,0,0.4)');
    fullCtx.fillStyle = g; fullCtx.fillRect(0,0,fullCanvas.width,fullCanvas.height);
    const cx = fullCanvas.width/2, cy = fullCanvas.height/2;
    const mr = Math.min(fullCanvas.width,fullCanvas.height)*0.4;
    for (let i=0;i<64;i++) {
        let v = freqData[i]/255, h = 10+v*80, a = (i/64)*Math.PI*2, r = mr+h*0.6;
        fullCtx.beginPath();
        fullCtx.moveTo(cx+Math.cos(a)*(mr-8),cy+Math.sin(a)*(mr-8));
        fullCtx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
        fullCtx.lineWidth=4; fullCtx.strokeStyle=`hsl(${320+v*80},100%,60%)`;
        fullCtx.shadowBlur=12; fullCtx.shadowColor='#ff0055'; fullCtx.stroke();
    }
    fullCtx.shadowBlur=0;
    if (freqData.reduce((a,b)=>a+b,0)>200) {
        for (let i=0;i<3;i++) {
            let a=Math.random()*Math.PI*2, sp=1+Math.random()*3, sz=2+Math.random()*4;
            particles.push(new Particle(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp,sz,`hsl(${Math.random()*60+300},80%,60%)`));
        }
    }
    for (let i=particles.length-1;i>=0;i--) { particles[i].update(); particles[i].draw(fullCtx); if (particles[i].alpha<=0) particles.splice(i,1); }
    requestAnimationFrame(drawFullVisualizer);
}
drawFullVisualizer();

function updateBarsVisualizer() {
    if (!analyser) { requestAnimationFrame(updateBarsVisualizer); return; }
    const d = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(d);
    const step = Math.floor(d.length/barsArray.length);
    for (let i=0;i<barsArray.length;i++) {
        let v=d[i*step]||0, h=(v/255)*80+4;
        barsArray[i].style.height=h+'px';
        barsArray[i].style.backgroundColor=`hsl(${320+(v/255)*40},100%,60%)`;
    }
    if (ringCtx) {
        ringCtx.clearRect(0,0,160,160);
        let avg=0; for(let i=0;i<d.length;i++) avg+=d[i]; avg/=d.length;
        ringCtx.beginPath(); ringCtx.arc(80,80,40+(avg/255)*50,0,Math.PI*2);
        ringCtx.strokeStyle=`rgba(255,0,85,${0.3+avg/500})`; ringCtx.lineWidth=3; ringCtx.stroke();
        for(let i=0;i<12;i++){
            let a=(Date.now()/300+i)%(Math.PI*2),r=70+(avg/255)*20;
            ringCtx.fillStyle='#ff0055'; ringCtx.beginPath();
            ringCtx.arc(80+Math.cos(a)*r,80+Math.sin(a)*r,3+avg/80,0,Math.PI*2); ringCtx.fill();
        }
    }
    requestAnimationFrame(updateBarsVisualizer);
}
updateBarsVisualizer();

// ===================== Utility =====================
function formatTime(s) { if(isNaN(s)||!isFinite(s)) return '0:00'; let m=Math.floor(s/60),sec=Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }
function showToast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500); }
function showLoading(s) { document.getElementById('loading-overlay').classList.toggle('show',s); }

// ===================== Init =====================
async function initApp() {
    const sv = localStorage.getItem('nmc_vol');
    if (sv !== null) { currentVolume = parseFloat(sv); if (isNaN(currentVolume)) currentVolume = 0.5; }
    const sl = localStorage.getItem('nmc_loop');
    if (sl === 'true') { loopMode = true; loopBtn.classList.add('active-loop'); }

    const initCtx = () => { setupAudioContext(); document.removeEventListener('click',initCtx); document.removeEventListener('touchstart',initCtx); };
    document.addEventListener('click', initCtx);
    document.addEventListener('touchstart', initCtx);

    try {
        const saved = await getAllSongsFromDB();
        if (saved.length) {
            playlist = saved.map(s => ({ id:s.id, name:s.name, startTime:s.startTime||0, endTime:s.endTime||0, fileSize:s.fileSize||0, fileType:s.fileType||'' }));
            showToast(`Đã tải ${playlist.length} bài hát`);
        }
    } catch(e) { console.error(e); }

    setVolume(currentVolume);
    updatePlaylistUI();

    const si = localStorage.getItem('nmc_idx');
    if (si !== null) { const idx = parseInt(si); if (idx >= 0 && idx < playlist.length) { currentIndex = idx; songTitleDisplay.innerText = playlist[currentIndex].name; } }

    setInterval(() => { localStorage.setItem('nmc_vol', currentVolume); localStorage.setItem('nmc_loop', loopMode); localStorage.setItem('nmc_idx', currentIndex); }, 2000);
}
initApp();

// ===================== Keyboard (chỉ giữ Play/Pause + Volume) =====================
document.addEventListener('keydown', e => {
    switch(e.code) {
        case 'Space': e.preventDefault(); isPlaying ? pauseAudio() : playAudio(); break;
        case 'ArrowUp': e.preventDefault(); setVolume(currentVolume + .05); break;
        case 'ArrowDown': e.preventDefault(); setVolume(currentVolume - .05); break;
    }
});

// ===================== Pin On Top (Always On Top) =====================
let pipWindow = null;
let pipSyncInterval = null;

async function togglePinOnTop() {
    // Method 1: Document Picture-in-Picture API (Chrome 116+)
    if ('documentPictureInPicture' in window) {
        if (pipWindow) {
            // Close PiP → restore main app
            pipWindow.close();
            pipWindow = null;
            if (pipSyncInterval) { clearInterval(pipSyncInterval); pipSyncInterval = null; }
            document.body.style.display = '';
            showToast('Đã thoát chế độ Ghim trên cùng');
            updatePinBtn();
            return;
        }
        try {
            pipWindow = await documentPictureInPicture.requestWindow({
                width: 380,
                height: 160
            });

            // Style PiP window
            const pipDoc = pipWindow.document;
            pipDoc.head.innerHTML = '';
            
            // Copy essential styles
            const styleEl = pipDoc.createElement('style');
            styleEl.textContent = `
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    background: #0a0a0f;
                    font-family: 'Inter','Segoe UI',system-ui,sans-serif;
                    color: #fff;
                    display: flex;
                    flex-direction: column;
                    height: 100vh;
                    padding: 10px;
                    gap: 8px;
                    overflow: hidden;
                    user-select: none;
                }
                .pip-title {
                    font-family: 'Orbitron',monospace;
                    font-size: 0.85rem;
                    font-weight: 700;
                    text-align: center;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    background: linear-gradient(90deg,#fff,#ff6b9d,#fff);
                    background-size: 200% auto;
                    -webkit-background-clip: text;
                    background-clip: text;
                    -webkit-text-fill-color: transparent;
                    animation: shimmer 3s linear infinite;
                }
                @keyframes shimmer { to { background-position: 200% center } }
                .pip-time {
                    font-family: 'Orbitron',monospace;
                    font-size: 0.65rem;
                    color: #ff0055;
                    text-align: center;
                }
                .pip-controls {
                    display: flex;
                    gap: 8px;
                    align-items: center;
                    justify-content: center;
                    flex: 1;
                }
                .pip-btn {
                    background: rgba(255,255,255,0.05);
                    border: 1.5px solid rgba(255,0,85,0.5);
                    color: #ff0055;
                    border-radius: 50%;
                    width: 44px;
                    height: 44px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    cursor: pointer;
                    font-size: 1rem;
                    transition: all 0.15s;
                    text-shadow: 0 0 8px rgba(255,0,85,0.4);
                }
                .pip-btn:hover { background: rgba(255,0,85,0.15); transform: scale(1.05); }
                .pip-btn:active { background: #ff0055; color: #fff; transform: scale(0.95); }
                .pip-btn.play-btn {
                    width: 52px; height: 52px; font-size: 1.2rem;
                    border-radius: 14px;
                }
                .pip-btn.play-btn.is-playing {
                    background: #ff0055 !important; color: #fff !important;
                    box-shadow: 0 0 20px rgba(255,0,85,0.4);
                }
                .pip-bar {
                    width: 100%;
                    height: 4px;
                    background: rgba(255,255,255,0.08);
                    border-radius: 2px;
                    overflow: hidden;
                    cursor: pointer;
                }
                .pip-bar-fill {
                    height: 100%;
                    background: linear-gradient(90deg, #ff0055, #ff3377);
                    border-radius: 2px;
                    transition: width 0.2s;
                    width: 0%;
                }
                .pip-vol-row {
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    font-size: 0.6rem;
                    color: #888;
                }
                .pip-vol-row i { color: #ff0055; font-size: 0.7rem; }
                .pip-vol-bar {
                    flex: 1; height: 3px; background: rgba(255,255,255,0.08);
                    border-radius: 2px; cursor: pointer; position: relative;
                }
                .pip-vol-fill {
                    height: 100%; background: #ff0055; border-radius: 2px;
                    transition: width 0.15s;
                }
                .pip-signature {
                    font-family: 'Orbitron',monospace;
                    font-size: 0.5rem;
                    color: #333;
                    text-align: center;
                    letter-spacing: 2px;
                }
                .pip-signature span { color: #ffd700; }
                .fa, .fas { font-family: 'Font Awesome 6 Free'; font-weight: 900; }
            `;
            pipDoc.head.appendChild(styleEl);

            // Copy Font Awesome link
            const faLink = pipDoc.createElement('link');
            faLink.rel = 'stylesheet';
            faLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
            pipDoc.head.appendChild(faLink);

            // Build PiP UI
            pipDoc.body.innerHTML = `
                <div class="pip-signature"><span>NMC</span> PRO</div>
                <div class="pip-title" id="pip-title">${escapeHtml(playlist[currentIndex]?.name || 'NMC Music Pro')}</div>
                <div class="pip-time" id="pip-time">0:00 / 0:00</div>
                <div class="pip-bar" id="pip-bar"><div class="pip-bar-fill" id="pip-bar-fill"></div></div>
                <div class="pip-controls">
                    <div class="pip-btn" id="pip-prev"><i class="fas fa-backward-step"></i></div>
                    <div class="pip-btn play-btn ${isPlaying ? 'is-playing' : ''}" id="pip-play"><i class="fas ${isPlaying ? 'fa-pause' : 'fa-play'}"></i></div>
                    <div class="pip-btn" id="pip-next"><i class="fas fa-forward-step"></i></div>
                </div>
                <div class="pip-vol-row">
                    <i class="fas fa-volume-low"></i>
                    <div class="pip-vol-bar" id="pip-vol-bar"><div class="pip-vol-fill" id="pip-vol-fill" style="width:${Math.round(currentVolume*100)}%"></div></div>
                    <span id="pip-vol-pct">${Math.round(currentVolume*100)}%</span>
                </div>
            `;

            // PiP control events
            pipDoc.getElementById('pip-play').addEventListener('click', () => {
                isPlaying ? pauseAudio() : playAudio();
            });
            pipDoc.getElementById('pip-prev').addEventListener('click', prevSong);
            pipDoc.getElementById('pip-next').addEventListener('click', nextSong);

            // PiP seek bar
            pipDoc.getElementById('pip-bar').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                const el = getEl();
                if (el.duration && isFinite(el.duration)) el.currentTime = pct * el.duration;
            });

            // PiP volume bar
            pipDoc.getElementById('pip-vol-bar').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                setVolume(pct);
            });

            // Sync PiP with main player
            pipSyncInterval = setInterval(() => {
                try {
                    if (!pipWindow || pipWindow.closed) {
                        clearInterval(pipSyncInterval);
                        pipSyncInterval = null;
                        pipWindow = null;
                        document.body.style.display = '';
                        updatePinBtn();
                        return;
                    }
                    const el = getEl();
                    const d = pipWindow.document;
                    // Title
                    const titleEl = d.getElementById('pip-title');
                    if (titleEl) titleEl.textContent = playlist[currentIndex]?.name || 'NMC Music Pro';
                    // Time
                    const timeEl = d.getElementById('pip-time');
                    if (timeEl && el.duration && isFinite(el.duration)) {
                        timeEl.textContent = `${formatTime(el.currentTime)} / ${formatTime(el.duration)}`;
                    }
                    // Progress bar
                    const fillEl = d.getElementById('pip-bar-fill');
                    if (fillEl && el.duration && isFinite(el.duration)) {
                        fillEl.style.width = ((el.currentTime / el.duration) * 100) + '%';
                    }
                    // Play button state
                    const playEl = d.getElementById('pip-play');
                    if (playEl) {
                        playEl.querySelector('i').className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
                        playEl.classList.toggle('is-playing', isPlaying);
                    }
                    // Volume
                    const volFill = d.getElementById('pip-vol-fill');
                    if (volFill) volFill.style.width = Math.round(currentVolume * 100) + '%';
                    const volPct = d.getElementById('pip-vol-pct');
                    if (volPct) volPct.textContent = Math.round(currentVolume * 100) + '%';
                } catch(e) { /* window closed */ }
            }, 250);

            // Hide main body (optional - keep it running but invisible)
            // We keep the main app visible so user can manage playlist

            // When PiP window closes
            pipWindow.addEventListener('pagehide', () => {
                pipWindow = null;
                if (pipSyncInterval) { clearInterval(pipSyncInterval); pipSyncInterval = null; }
                updatePinBtn();
            });

            showToast('Đã ghim trên cùng 📌');
            updatePinBtn();
            return;
        } catch(e) {
            console.log('PiP failed:', e);
        }
    }

    // Method 2: Fallback - open mini popup window
    if (!pipWindow || pipWindow.closed) {
        const w = 400, h = 220;
        const left = (screen.width - w) / 2;
        const top = 0;
        const miniWin = window.open('', 'nmc_mini_player', `width=${w},height=${h},left=${left},top=${top},alwaysOnTop=yes,location=no,menubar=no,toolbar=no,status=no`);
        if (miniWin) {
            miniWin.document.head.innerHTML = `
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                <style>
                    *{margin:0;padding:0;box-sizing:border-box}
                    body{background:#0a0a0f;font-family:'Inter',system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;height:100vh;padding:10px;gap:6px;overflow:hidden;user-select:none}
                    .t{font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ff6b9d}
                    .tm{font-family:'Orbitron',monospace;font-size:.6rem;color:#ff0055;text-align:center}
                    .c{display:flex;gap:8px;align-items:center;justify-content:center;flex:1}
                    .b{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,0,85,.5);color:#ff0055;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .15s}
                    .b:hover{background:rgba(255,0,85,.15)}
                    .b:active{background:#ff0055;color:#fff}
                    .bp{width:52px;height:52px;font-size:1.2rem;border-radius:14px}
                    .bp.on{background:#ff0055!important;color:#fff!important;box-shadow:0 0 20px rgba(255,0,85,.4)}
                    .sig{font-family:'Orbitron',monospace;font-size:.45rem;color:#333;text-align:center;letter-spacing:2px}
                    .sig span{color:#ffd700}
                </style>
            `;
            miniWin.document.body.innerHTML = `
                <div class="sig"><span>NMC</span> PRO</div>
                <div class="t" id="mt">${escapeHtml(playlist[currentIndex]?.name||'NMC Music Pro')}</div>
                <div class="tm" id="mm">0:00 / 0:00</div>
                <div class="c">
                    <div class="b" id="mbp"><i class="fas fa-backward-step"></i></div>
                    <div class="b bp ${isPlaying?'on':''}" id="mbpl"><i class="fas ${isPlaying?'fa-pause':'fa-play'}"></i></div>
                    <div class="b" id="mbn"><i class="fas fa-forward-step"></i></div>
                </div>
            `;
            miniWin.document.getElementById('mbpl').onclick = () => { isPlaying ? pauseAudio() : playAudio(); };
            miniWin.document.getElementById('mbp').onclick = prevSong;
            miniWin.document.getElementById('mbn').onclick = nextSong;
            
            pipWindow = miniWin;
            // Sync mini window
            if (pipSyncInterval) clearInterval(pipSyncInterval);
            pipSyncInterval = setInterval(() => {
                try {
                    if (!pipWindow || pipWindow.closed) {
                        clearInterval(pipSyncInterval); pipSyncInterval = null; pipWindow = null; updatePinBtn(); return;
                    }
                    const el = getEl();
                    const d = pipWindow.document;
                    const mt = d.getElementById('mt');
                    if (mt) mt.textContent = playlist[currentIndex]?.name || 'NMC Music Pro';
                    const mm = d.getElementById('mm');
                    if (mm && el.duration && isFinite(el.duration)) mm.textContent = `${formatTime(el.currentTime)} / ${formatTime(el.duration)}`;
                    const mbpl = d.getElementById('mbpl');
                    if (mbpl) { mbpl.querySelector('i').className = isPlaying ? 'fas fa-pause' : 'fas fa-play'; mbpl.classList.toggle('on', isPlaying); }
                } catch(e) {}
            }, 250);
            miniWin.addEventListener('beforeunload', () => { pipWindow = null; if (pipSyncInterval) { clearInterval(pipSyncInterval); pipSyncInterval = null; } updatePinBtn(); });
            showToast('Đã mở mini player 📌');
            updatePinBtn();
        } else {
            showToast('Trình duyệt không hỗ trợ Ghim trên cùng');
        }
    } else {
        pipWindow.focus();
    }
}

function updatePinBtn() {
    const btn = document.getElementById('pin-btn');
    if (!btn) return;
    const isPinned = pipWindow && !pipWindow.closed;
    btn.classList.toggle('is-pinned', isPinned);
    btn.querySelector('i').className = isPinned ? 'fas fa-thumbtack' : 'fas fa-thumbtack';
    btn.title = isPinned ? 'Đã ghim trên cùng' : 'Ghim trên cùng';
}
</script>
