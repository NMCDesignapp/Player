name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate hosted Android SDK
        run: |
          echo "Using ANDROID_HOME=${ANDROID_HOME}"
          which sdkmanager || true
          ls -la "${ANDROID_HOME}/cmdline-tools" || true
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK 35
        run: |
          set -e
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="${ANDROID_HOME}/cmdline-tools/16.0/bin:${PATH}"
          fi
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle offline player, icons and Font Awesome
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/vendor/fa/css
          mkdir -p android/app/src/main/assets/vendor/fa/webfonts
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css -o android/app/src/main/assets/vendor/fa/css/all.min.css
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2 -o android/app/src/main/assets/vendor/fa/webfonts/fa-solid-900.woff2
          python3 - <<'PY'
          import re, base64, pathlib
          base=pathlib.Path("android/app/src/main")
          html=pathlib.Path("index.html").read_text(encoding="utf-8")
          pattern=r'<link rel="apple-touch-icon" href="data:image/png;base64,([^"]+)"'
          match=re.search(pattern,html)
          if not match:
              raise ValueError("Could not find embedded app icon")
          icon=base64.b64decode(match.group(1))
          (base/"res/mipmap-xxxhdpi/ic_launcher.png").write_bytes(icon)
          html=html.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css",
              "vendor/fa/css/all.min.css")
          (base/"assets/index.html").write_text(html, encoding="utf-8")
          PY
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NC-Music-Player-v1.0.0.apk
          sha256sum NC-Music-Player-v1.0.0.apk
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NC-Music-Player-Android-v1.0.0
          path: NC-Music-Player-v1.0.0.apk
          retention-days: 90
      - name: Publish APK download in GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.0 > /dev/null 2>&1; then
            gh release upload android-v1.0.0 NC-Music-Player-v1.0.0.apk --clobber
          else
            gh release create android-v1.0.0 NC-Music-Player-v1.0.0.apk --title "NC Music Player Android v1.0.0" --notes "Android APK (sideloadable debug build). Local offline player with file picker, phone/tablet layouts and persistent per-app music library. Requires Android 8 or later."
          fi
